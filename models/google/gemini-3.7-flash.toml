schema = 2
name = "Gemini 3.7 Flash"
description = "High-efficiency Gemini model for agentic workflows, coding, and multimodal reasoning"
family = "gemini-flash"
open_weights = false
knowledge = "2026-03"
release_date = "2026-08-13"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
  "application/pdf",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 65_536

[[benchmarks]]
name = "FrontierCode"
score = 43.6
metric = "score"
version = "1.1 Main"
source = "https://deepmind.google/models/model-cards/gemini-3-7-flash/"

[[benchmarks]]
name = "DeepSWE"
score = 65.3
metric = "pass@1"
version = "1.1"
effort = "High"
variant = "self-computed; LiteLLM 1.96; high thinking"
harness = "mini-swe-agent"
source = "https://deepmind.google/models/model-cards/gemini-3-7-flash/"

