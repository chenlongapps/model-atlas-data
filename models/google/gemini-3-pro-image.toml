# Image output formats: https://ai.google.dev/gemini-api/docs/image-generation (response_format mime_type image/png or image/jpeg).
schema = 2
type = "image"
name = "Nano Banana Pro"
description = "Nano Banana Pro for higher-fidelity image generation and design-heavy edits"
family = "gemini-pro"
open_weights = false
knowledge = "2025-01"
# Official release date: https://blog.google/innovation-and-ai/products/nano-banana-pro/ (2025-11-20)
release_date = "2025-11-20"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text", "image/png", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 65_536
output = 32_768
