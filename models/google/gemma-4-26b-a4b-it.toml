# Image MIME types: served on the Gemini API (https://ai.google.dev/gemma/docs/core/gemma_on_gemini_api).
# Gemini API image formats: https://ai.google.dev/gemini-api/docs/image-understanding (Supported image formats: image/png, image/jpeg, image/webp, image/heic, image/heif)
schema = 2
name = "Gemma 4 26B A4B IT"
description = "Open Gemma instruction model for efficient chat and self-hosted deployments"
family = "gemma"
open_weights = true
release_date = "2026-04-02"

[metadata.modelatlas.parameters]
total_billion = 25.805936206
active_billion = 3.8
sources = ["https://huggingface.co/api/models/google/gemma-4-26B-A4B-it", "https://huggingface.co/google/gemma-4-26B-A4B-it"]
notes = "Total is the Hub-published BF16 count for the complete multimodal checkpoint, not the table's 25.2B language component. Per-token active count is explicitly reported in the official model card."

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 32_768

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/google/gemma-4-26B-A4B-it"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 8.7
metric = "accuracy"
variant = "instruction-tuned; HLE no tools"
source = "https://ai.google.dev/gemma/docs/core/model_card_4"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 17.2
metric = "accuracy"
variant = "instruction-tuned; HLE with search"
source = "https://ai.google.dev/gemma/docs/core/model_card_4"
