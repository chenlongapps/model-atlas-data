# Evaluation settings and benchmark-specific methodology are linked from the launch post.
# Methodology: https://deepmind.google/models/evals-methodology/gemini-3-8-flash
# Sources:
# - https://ai.google.dev/gemini-api/docs/models/gemini-3.8-flash
# - https://ai.google.dev/gemini-api/docs/latest-model
schema = 2
name = "Gemini 3.8 Flash"
description = "Google's most intelligent Flash model, engineered for long-horizon software engineering, autonomous agents, and complex enterprise workflows"
family = "gemini-flash"
open_weights = false
release_date = "2026-09-02"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
  "application/pdf",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 65_536

[[benchmarks]]
name = "DeepSWE"
score = 73.7
metric = "pass@1"
version = "1.1"
harness = "mini-swe-agent"
