# Lab metadata carried over from providers/openrouter/models/google/gemini-2.5-pro-preview.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
schema = 2
name = "Gemini 2.5 Pro Preview 06-05"
description = "Advanced Gemini model for complex reasoning, coding, and multimodal analysis"
family = "gemini"
open_weights = false
knowledge = "2025-01-31"
release_date = "2025-06-05"

[modalities]
input = [
  "application/pdf",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "text",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 65_536

[[benchmarks]]
name = "Humanity's Last Exam"
score = 21.64
metric = "accuracy"
dataset = "Final original HLE; 2,500 public questions, multimodal"
variant = "Scale Labs evaluation; temperature=0.0 when configurable (otherwise provider-stated); o3-mini-2025-01-31 extractor/judge; tool use not stated"
harness = "Scale Labs leaderboard"
source = "https://labs.scale.com/leaderboard/humanitys_last_exam"
