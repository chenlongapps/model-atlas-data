# Sources (checked 2026-11-13):
# - https://github.com/anomalyco/models.dev/blob/dev/models/google/gemini-4-hydrogen.toml
# - https://aistudio.google.com/docs/models/gemini-4-hydrogen
# - https://aistudio.google.com/docs/whats-new-gemini-4-hydrogen
# - https://deepmind.google/models/model-cards/gemini-4-hydrogen/
# - https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-hydrogen/
# - https://storage.googleapis.com/deepmind-media/gemini/gemini_4_hydrogen_model_evaluation.pdf
# Input, thinking, and output share one 1,048,576-token window. Synchronous
# output is capped at 65,536 tokens per hop; longer output requires background
# execution or client-side continuation (long decode). No separate input limit
# is inferred. API prices and caching are provider-specific and are not stored here.
schema = 2
name = "Gemini 4 Hydrogen"
description = "Google's Gemini 4 model for everyday coding and agentic workflows, with four thinking levels and a 1M-token context window"
family = "gemini"
open_weights = false
knowledge = "2026-03"
release_date = "2026-11-12"

[modalities]
input = [
  "text",
  "image/png",
  "image/jpeg",
  "image/webp",
  "image/heic",
  "image/heif",
  "video/mp4",
  "video/mpeg",
  "video/mov",
  "video/avi",
  "video/x-flv",
  "video/mpg",
  "video/webm",
  "video/wmv",
  "video/3gpp",
  "audio/wav",
  "audio/mp3",
  "audio/aiff",
  "audio/aac",
  "audio/ogg",
  "audio/flac",
  "audio/mpeg",
  "audio/m4a",
  "audio/l16",
  "audio/opus",
  "audio/alaw",
  "audio/mulaw",
  "audio/webm",
  "application/pdf",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
# Custom sampling parameters are ignored by the Gemini API.
temperature = false
top_p = false
top_k = false

[limit]
context = 1_048_576
output = 65_536

# Google model-card results, with conditions from the evaluation PDF above.
# Google's self-computed results use the highest thinking setting (xhigh),
# except Terminal-Bench, which explicitly uses high. Do not apply this setting
# to results Google sourced from external leaderboards without row-level proof.
[[benchmarks]]
name = "SWE-sweep"
score = 13.5
metric = "subtask-weighted reward"
effort = "xhigh"
variant = "Google self-computed; pass@1; official integration; safety filters enabled"
harness = "Antigravity-CLI (agy) 1.4.8"
source = "https://deepmind.google/models/model-cards/gemini-4-hydrogen/"

[[benchmarks]]
name = "Terminal-Bench"
score = 57.0
metric = "cheating-adjusted accuracy"
version = "4.1"
effort = "high"
variant = "Google self-computed; Average Reward over 5 attempts per task"
harness = "mini-swe-agent vision"
source = "https://deepmind.google/models/model-cards/gemini-4-hydrogen/"

[[benchmarks]]
name = "Agents' Last Exam"
score = 71.6
metric = "averaged rubric Score"
version = "1.1"
dataset = "122 tasks; October 17, 2026 task version, without the October 26 update"
effort = "xhigh"
variant = "Google self-computed; pass@1; 5-hour window; official integration; safety-filtered responses become empty strings, but episodes may continue"
harness = "Antigravity-CLI (agy) 1.4.8"
source = "https://deepmind.google/models/model-cards/gemini-4-hydrogen/"

# Secondary report: Google explicitly attributes this result to Artificial
# Analysis. No independent AA scrape or inferred reasoning effort is included.
[[benchmarks]]
name = "AutomationBench-AA"
score = 76.1
metric = "%"
variant = "Reported by Google from the Artificial Analysis leaderboard"
source = "https://deepmind.google/models/model-cards/gemini-4-hydrogen/"

[[benchmarks]]
name = "Vending-Bench"
score = 14549
metric = "bank balance (USD)"
version = "2"
variant = "Reported by Google from the Andon Labs public leaderboard"
source = "https://deepmind.google/models/model-cards/gemini-4-hydrogen/"

# Partial score is not the binary completion rate in the existing definition.
[[benchmarks]]
name = "OSWorld"
score = 77.6
metric = "partial score"
version = "osworld-v2.1"
dataset = "OSWorld-2.1 offline subset (82 tasks)"
effort = "xhigh"
variant = "Google self-computed; maximum across 3 single-attempt runs; official Docker and evaluator; 1080p; 500-step limit; screenshot-only observations; PyAutoGUI; parallel batch tool calling; all screenshots retained with compaction; safety-filtered responses become empty strings, but episodes may continue"
harness = "Gemini CUA"
source = "https://deepmind.google/models/model-cards/gemini-4-hydrogen/"

[[benchmarks]]
name = "MKA"
score = 53.4
metric = "Climb WSR accuracy"
effort = "xhigh"
variant = "Google self-computed; pass@1"
source = "https://deepmind.google/models/model-cards/gemini-4-hydrogen/"

[[benchmarks]]
name = "Chartography"
score = 66.6
metric = "pass@1"
effort = "xhigh"
variant = "Google self-computed; without tools; following the official Surge public leaderboard"
source = "https://deepmind.google/models/model-cards/gemini-4-hydrogen/"

[[benchmarks]]
name = "Terminal-Bench-Science"
score = 51.4
metric = "Average Reward"
version = "0.1"
effort = "xhigh"
variant = "Google self-computed; averaged over 5 attempts per task"
harness = "mini-swe-agent vision"
source = "https://deepmind.google/models/model-cards/gemini-4-hydrogen/"

# Secondary report, not a separately verified AA observation.
[[benchmarks]]
name = "HLE-Diamond"
score = 58.8
metric = "%"
variant = "Reported by Google from the Artificial Analysis leaderboard"
source = "https://deepmind.google/models/model-cards/gemini-4-hydrogen/"

