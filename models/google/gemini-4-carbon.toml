# Sources (model information rechecked 2026-11-17):
# - https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-carbon/
# - https://ai.google.dev/gemini-api/docs/models/gemini-4-carbon
# - https://ai.google.dev/gemini-api/docs/whats-new-gemini-4-carbon
# - https://www.vals.ai/models/google_gemini-4-carbon
# - https://www.vals.ai/benchmarks/vals_index
# First announced 2026-10-28; broader availability began 2026-11-10.
# Google ignores temperature, top_p and top_k. Keep provider-specific MIME lists
# and API generation limits out of the provider-agnostic model information.
# Historical 2026-11-06 notes before the first benchmark are preserved verbatim;
# the model information above that block now follows the official documentation.
schema = 2
name = "Gemini 4 Carbon"
description = "Google's most capable reasoning model for complex software engineering, deep math and science, high factual accuracy, and long-horizon autonomous agents"
family = "gemini"
open_weights = false
release_date = "2026-11-10"
knowledge = "2026-03"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/heic", "image/heif", "video/mp4", "video/mpeg", "video/mov", "video/avi", "video/x-flv", "video/mpg", "video/webm", "video/wmv", "video/3gpp", "audio/wav", "audio/mp3", "audio/aiff", "audio/aac", "audio/ogg", "audio/flac", "audio/mpeg", "audio/m4a", "audio/l16", "audio/opus", "audio/alaw", "audio/mulaw", "audio/webm", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_048_576
# Input, thinking and output share the context window. The Gemini API's standard
# synchronous cap is 65,536; long decode can reach 1,048,576 minus input tokens.
# Omit output: one unconditional scalar cannot describe both API execution modes.
output = 65536

[[links]]
url = "https://ai.google.dev/gemini-api/docs/models/gemini-4-carbon"
type = "documentation"

[[links]]
url = "https://blog.google/innovation-and-ai/models-and-research/gemini-models/introducing-gemini-4-carbon/"
type = "announcement"

# Vals displays 1M context and output, without an exact model specification.

# JSON model = "google/gemini-4-carbon"; stderr = 0.974; provider = "Google".
# Evaluation settings: max_output_tokens = 1048576; reasoning_effort = "high".
# The profile's Oct 28 update reports 70.36; this is the current JSON observation,
# not a claim that the historical result was officially corrected.
