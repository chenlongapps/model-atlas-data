# Sources (checked 2026-11-06):
# - https://www.vals.ai/models/google_gemini-4-carbon
# - https://www.vals.ai/benchmarks/vals_index
# Models.dev has no lab model file for Carbon yet. Google's model catalogue
# currently lists Argon but not Carbon; this profile uses Vals' explicit identity.
# Vals lists text, image, video and unspecified file inputs. File MIME types,
# exact model limits and sampling capabilities are not established; omit them.
# The JSON's max_output_tokens below is an evaluation setting, not a model limit.
schema = 2
name = "Gemini 4 Carbon"
description = "Google reasoning model evaluated by Vals on agentic finance, coding, legal, and tax tasks; model details are currently based on Vals' profile."
family = "gemini"
open_weights = false
release_date = "2026-10-28"

[modalities]
input = ["text", "image", "video"]
output = ["text"]

[capabilities]
reasoning = { supported = true }

[limit]
# Vals displays 1M context and output, without an exact model specification.

# JSON model = "google/gemini-4-carbon"; stderr = 0.974; provider = "Google".
# Evaluation settings: max_output_tokens = 1048576; reasoning_effort = "high".
# The profile's Oct 28 update reports 70.36; this is the current JSON observation,
# not a claim that the historical result was officially corrected.
[[benchmarks]]
name = "Vals Index"
score = 70.45
cost = 10.508065
cost_unit = "USD/test"
metric = "performance score"
version = "2.2"
effort = "high"
source = "https://www.vals.ai/_astro/benchmark_view_vals_index.CxyItaos.json"

# Vals overall JSON checked 2026-11-06; model = "google/gemini-4-carbon"; stderr = 2.201 percentage points.
# Row settings: max_output_tokens = 1048576; reasoning_effort = "high"; provider = "Google".
[[benchmarks]]
name = "Terminal-Bench"
score = 63.131
metric = "task resolution rate"
version = "4.0"
dataset = "66 tasks"
effort = "high"
variant = "avg@3 (mean of three pass@1 runs); 8-hour task limit; no step or cost limit"
harness = "Mini-SWE-agent"
cost = 7.452059
cost_unit = "USD/test"
source = "https://www.vals.ai/_astro/benchmark_view_terminal_bench_4.g-vQx4Dh.json"
