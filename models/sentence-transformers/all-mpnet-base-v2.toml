# https://huggingface.co/sentence-transformers/all-mpnet-base-v2
# Released 2021-08-30: initial commit of the model repository (https://huggingface.co/sentence-transformers/all-mpnet-base-v2/commits/main)
# Trained during Hugging Face's Community week using JAX/Flax for NLP & CV (model card)
# Context: max_seq_length 384 (https://huggingface.co/sentence-transformers/all-mpnet-base-v2/blob/main/sentence_bert_config.json);
#   768-dimensional output.
schema = 2
v2_only = true
type = "embedding"
name = "all-mpnet-base-v2"
description = "Sentence and short-paragraph embedding model for clustering and semantic search"
open_weights = true
release_date = "2021-08-30"
license = "Apache-2.0"

[metadata.modelatlas.parameters]
total_billion = 0.109486464
sources = ["https://huggingface.co/api/models/sentence-transformers/all-mpnet-base-v2"]
notes = "Hub-published F32 parameter count for the complete checkpoint; excludes separately reported integer tensors."

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 384
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/sentence-transformers/all-mpnet-base-v2"
