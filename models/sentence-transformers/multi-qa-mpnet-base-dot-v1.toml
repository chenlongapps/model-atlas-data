# https://huggingface.co/sentence-transformers/multi-qa-mpnet-base-dot-v1
# Released 2021-08-23: initial commit of the model repository (https://huggingface.co/sentence-transformers/multi-qa-mpnet-base-dot-v1/commits/main)
# Trained during Hugging Face's Community week using JAX/Flax for NLP & CV (model card)
# Context: max_seq_length 512 (https://huggingface.co/sentence-transformers/multi-qa-mpnet-base-dot-v1/blob/main/sentence_bert_config.json);
#   768-dimensional output.
schema = 2
v2_only = true
type = "embedding"
name = "multi-qa-mpnet-base-dot-v1"
description = "Semantic search embedding model trained on 215M question-answer pairs"
open_weights = true
release_date = "2021-08-23"

[metadata.modelatlas.parameters]
total_billion = 0.109486464
sources = ["https://huggingface.co/api/models/sentence-transformers/multi-qa-mpnet-base-dot-v1"]
notes = "Hub-published F32 parameter count for the complete checkpoint; excludes separately reported integer tensors."

[modalities]
input = ["text"]
output = ["embedding"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 512
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/sentence-transformers/multi-qa-mpnet-base-dot-v1"
