# Sarvam Prism is a System-1 decision model built on Sarvam 105B. It returns a
# calibrated probability for every option and generates no text, so output is 0.
schema = 2
v2_only = true
type = "decision"
name = "Sarvam Prism"
description = "System-1 decision model built on Sarvam 105B that returns calibrated probabilities for yes/no, choice, and score questions"
family = "sarvam-prism"
open_weights = true
release_date = "2026-11-03"

[metadata.modelatlas.parameters]
total_billion = 105.021348736
sources = ["https://huggingface.co/sarvamai/prism/blob/417cf26c2eea27286a803dd721b4e78698bdb875/README.md", "https://huggingface.co/api/models/sarvamai/prism", "https://huggingface.co/sarvamai/prism/blob/417cf26c2eea27286a803dd721b4e78698bdb875/decision_head.safetensors"]
notes = "Fixed FP8 release: 104,991,889,280 backbone parameters (FP8 logical count) plus 29,459,456 decision-head parameters verified from the tensor header. The card does not state a separate active count."

[modalities]
input = ["text"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 131_072
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/sarvamai/prism"
