# Lab metadata carried over from providers/openrouter/models/ibm-granite/granite-4.2-8b.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Release: https://huggingface.co/ibm-granite/granite-4.2-8b (model card "Release Date: August 25, 2026"; Apache-2.0)
# Sampling: open weights; generation_config.json sets temperature 1.0 and top_p 0.95
# (https://huggingface.co/ibm-granite/granite-4.2-8b/blob/main/generation_config.json).
schema = 2
name = "Granite 4.2 8B"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
family = "granite"
open_weights = true
release_date = "2026-08-25"

[metadata.modelatlas.parameters]
total_billion = 8
sources = ["https://huggingface.co/ibm-granite/granite-4.2-8b"]

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 117_964

[[benchmarks]]
name = "Artificial Analysis Intelligence Index"
score = 5.09826495217051
cost = 0.0404628507686443
cost_unit = "USD/weighted task"
metric = "index score"
version = "5.0.1"
source = "https://artificialanalysis.ai/models/granite-4-2-8b/"
