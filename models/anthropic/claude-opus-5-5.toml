# tools.choice: forced tool use (any/tool) returns a 400 on every host: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools#forcing-tool-use
# Launch evaluations use adaptive thinking and production safeguards, with Opus 4.8 fallback for cyber and Opus 5 for bio/frontier-LLM development.
# AutomationBench disables fallback and counts safeguard-triggered tasks as failures; Terminal-Bench uses xhigh effort.
schema = 2
name = "Claude Opus 5.5"
description = "Claude model for long-running agentic coding and knowledge work"
family = "claude-opus"
open_weights = false
knowledge = "2026-06"
release_date = "2026-09-22"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 128_000

[[benchmarks]]
name = "DeepSWE"
score = 74.2
metric = "pass@1"
version = "1.1"
dataset = "113 tasks"
effort = "Max"
variant = "mean of 5 trials"
source = "https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf"

[[benchmarks]]
name = "Terminal-Bench"
score = 66.36
metric = "task resolution rate"
version = "4.0.0"
effort = "Xhigh"
variant = "production safeguards with fallback; 5 trials per task (330 runs)"
harness = "Claude Code --bare"
source = "https://www-cdn.anthropic.com/fc1b44717c85dc068bc6ba5024219938094694bd/Claude%20Opus%205.5%20System%20Card.pdf"

