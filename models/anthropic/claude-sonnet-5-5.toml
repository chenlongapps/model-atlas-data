# tools.choice: forced tool use (any/tool) returns a 400 on every host: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools#forcing-tool-use
# Specs: https://platform.claude.com/docs/en/models/sonnet-5-5/overview
# Evaluations: https://www.anthropic.com/claude-sonnet-5-5
schema = 2
name = "Claude Sonnet 5.5"
description = "Fast Claude model for everyday coding, agents, and knowledge work"
family = "claude-sonnet"
open_weights = false
knowledge = "2026-06"
release_date = "2026-09-28"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 128_000

[[benchmarks]]
name = "Terminal-Bench"
score = 70.6
metric = "task resolution rate"
version = "4.0.0"
source = "https://www.anthropic.com/claude-sonnet-5-5"

[[benchmarks]]
name = "FrontierCode"
score = 46.2
metric = "score"
variant = "max effort"
version = "1.1"
dataset = "Main"
source = "https://www.anthropic.com/claude-sonnet-5-5"
date = "2026-09-28"

