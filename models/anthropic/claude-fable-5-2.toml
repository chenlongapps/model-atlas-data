# Based on https://github.com/anomalyco/models.dev/blob/dev/models/anthropic/claude-fable-5-2.toml
# Specifications: https://platform.claude.com/docs/en/models/fable-5-2/overview
# Image/PDF input: https://platform.claude.com/docs/en/build-with-claude/vision and https://platform.claude.com/docs/en/build-with-claude/pdf-support
# Forced tool use and sampling restrictions: https://platform.claude.com/docs/en/models/fable-5-2/whats-new-fable-5-2
# Launch-table scores have safeguards on; cyber and biology blocks can fall back to Opus 4.8 and Opus 5 respectively.
# "Highest available effort" is retained as a condition, not inferred to mean a named effort level.
schema = 2
name = "Claude Fable 5.2"
description = "Claude model for demanding reasoning and long-horizon agentic work"
family = "claude-fable"
open_weights = false
knowledge = "2026-06"
release_date = "2026-11-09"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 128_000

