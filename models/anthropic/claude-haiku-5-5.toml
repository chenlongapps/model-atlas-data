schema = 2
name = "Claude Haiku 5.5"
description = "Fast Claude model for responsive assistance, classification, and lightweight agents"
family = "claude-haiku"
open_weights = false
knowledge = "2026-06"
release_date = "2026-10-07"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 128_000

