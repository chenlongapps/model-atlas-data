# tools.choice: forced tool use (any/tool) returns a 400 on every host: https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools#forcing-tool-use
# Launch evaluations enable production safeguards: cyber tasks may fall back to Opus 4.8, biology tasks to Opus 5.
# OSWorld uses the August 2026 task release and scores safeguard interventions as zero, without fallback.
schema = 2
name = "Claude Fable 5.1"
description = "Claude model for demanding reasoning and long-horizon agentic work"
family = "claude-fable"
open_weights = false
knowledge = "2026-06"
release_date = "2026-09-01"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true, choice = ["auto", "none"] }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_000_000
output = 128_000

