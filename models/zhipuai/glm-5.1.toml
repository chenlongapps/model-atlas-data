schema = 2
name = "GLM-5.1"
description = "Strong GLM coding model for agentic engineering, terminals, and repository generation"
family = "glm"
open_weights = true
release_date = "2026-04-07"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 200_000
output = 131_072

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/zai-org/GLM-5.1"

[[benchmarks]]
name = "Artificial Analysis Coding Agent Index"
score = 52.7
metric = "average pass@1"
harness = "Claude Code"
source = "https://artificialanalysis.ai/agents/coding-agents"

[[benchmarks]]
name = "SWE-Atlas Codebase QnA"
score = 73.2
metric = "pass@1"
harness = "Claude Code"
source = "https://artificialanalysis.ai/agents/coding-agents"

[[benchmarks]]
name = "SWE-Bench Pro"
score = 19.8
metric = "pass@1"
harness = "Claude Code"
dataset = "hard-aa"
source = "https://artificialanalysis.ai/agents/coding-agents"

[[benchmarks]]
name = "Terminal-Bench"
score = 65.1
metric = "pass@1"
