# Benchmark settings and caveats: https://huggingface.co/zai-org/GLM-5.3#footnotes
schema = 2
name = "GLM-5.3"
description = "Flagship GLM model for long-horizon coding, agents, and complex project delivery"
family = "glm"
open_weights = true
