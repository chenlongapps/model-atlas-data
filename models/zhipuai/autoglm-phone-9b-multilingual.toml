# https://huggingface.co/zai-org/AutoGLM-Phone-9B-Multilingual
# Input formats (accessed 2026-10-20): screenshots via image_url, jpg, jpeg, png (≤5 MB, ≤6000×6000 px).
# - https://docs.bigmodel.cn/api-reference/模型-api/对话补全 (autoglm-phone is in the vision model list)
# - https://docs.z.ai/api-reference/llm/chat-completion, https://docs.z.ai/guides/vlm/autoglm-phone-multilingual
schema = 2
name = "AutoGLM Phone 9B Multilingual"
description = "Multilingual visual model for operating smartphone interfaces and mobile agents"
family = "glm"
open_weights = true
release_date = "2025-12-10"
license = "MIT"

[metadata.modelatlas.parameters]
total_billion = 10.292777472
sources = ["https://huggingface.co/zai-org/AutoGLM-Phone-9B-Multilingual/blob/832ab5e014b965268dafd944e64cbc8e4bade892/model.safetensors.index.json", "https://huggingface.co/zai-org/AutoGLM-Phone-9B-Multilingual"]
notes = "Complete multimodal checkpoint: 10,292,777,472 BF16 weight/bias values independently counted from all five shard headers at the pinned commit. The Hub API's inconsistent total of 934,400 is not used. The official card identifies the GLM-4.1V-9B-Thinking architecture; no count is inferred from its name."

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 65_536
output = 65_536

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/zai-org/AutoGLM-Phone-9B-Multilingual"
