# Published March 2025 (Apache-2.0): https://huggingface.co/sesame/csm-1b
# Output formats: mp3 and pcm, as documented for OpenRouter's speech API (the lab lists none here):
#   https://openrouter.ai/docs/guides/overview/multimodal/tts
schema = 2
v2_only = true
type = "speech"
name = "CSM 1B"
description = "Open conversational speech generation model"
open_weights = true
release_date = "2025-03"
license = "Apache-2.0"

[metadata.modelatlas.parameters]
total_billion = 1.552791552
sources = ["https://huggingface.co/api/models/sesame/csm-1b"]
