# Sources:
# https://research.meta.ai/blog/muse-wonder
# https://research.meta.ai/static/muse-wonder-model-card (PDF; scores on the capabilities scorecard)
# The model card states a 1M-token context; Meta documents its 1M Muse context as 1,048,576 tokens.
# Meta has not yet published an output limit, knowledge cutoff, or API reference for this model.
# Only available in Muse Code (https://dev.meta.ai/docs/models), not the API; sampling
# follows Muse Wonder 1.0's documented API parameters.
# Modalities stay generic: Muse Wonder Full runs only in Muse Code, not on Model API (https://dev.meta.ai/docs/models),
# and the Muse Code docs (https://dev.meta.ai/docs/muse-code/interactive) name no image, video or audio formats.
# Model API's format lists cover muse-wonder-1.0 only.
schema = 2
name = "Muse Wonder Full"
description = "Muse Wonder Full is the most capable model in Meta's Muse Wonder series, built for long-running professional agents and ultra-long-horizon software engineering. It shares Muse Wonder's Active Memory and Active Focus capabilities and generally scores higher on Meta's agentic and coding evaluations."
family = "muse"
open_weights = false
release_date = "2026-10-12"

[modalities]
input = ["text", "image", "video", "audio"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_048_576

[[links]]
label = "Announcement"
url = "https://research.meta.ai/blog/muse-wonder"
type = "announcement"

[[links]]
label = "Model card"
url = "https://research.meta.ai/static/muse-wonder-model-card"
type = "model_card"

