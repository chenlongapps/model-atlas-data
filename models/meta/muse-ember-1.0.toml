# Sources checked 2026-11-10:
# - Release, capabilities and scores: https://research.meta.ai/blog/muse-ember
# - Exact context/output limits and API ID: https://dev.meta.ai/docs/muse-ember
# - Evaluation conditions: https://research.meta.ai/static/muse-ember-evaluation-report
# - Sampling: https://dev.meta.ai/docs/protocols/chat-completions and https://dev.meta.ai/docs/protocols/messages
# - Media formats: https://dev.meta.ai/docs/media-understanding#supported-formats
# Models.dev's dev/models/meta catalog has no Ember entry at the time of checking;
# the path uses Meta's official versioned API ID, consistent with the Muse lab files.
# Parameter counts and knowledge cutoff are not disclosed. API pricing, cache and
# reasoning-effort controls are provider-specific and are not model attributes.
schema = 2
name = "Muse Ember"
description = "Muse Ember is a multimodal reasoning model from Meta for high-volume, repeated agentic work, including coding subtasks, tool calls, routing, document summarization, and extraction. It accepts text, images, audio, video, and PDFs and outputs text."
family = "muse"
open_weights = false
release_date = "2026-11-09"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "application/pdf", "audio/mpeg", "audio/wav"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_048_576
output = 524_288

[[links]]
label = "Announcement"
url = "https://research.meta.ai/blog/muse-ember"
type = "announcement"

[[links]]
label = "Documentation"
url = "https://dev.meta.ai/docs/muse-ember"
type = "docs"

[[links]]
label = "Evaluation report"
url = "https://research.meta.ai/static/muse-ember-evaluation-report"
type = "model_card"

# Scores below are the max-effort launch scorecard. Methodology is in the linked
# evaluation report; publication dates are not treated as evaluation dates.
# Artificial Analysis results are its November 9 snapshot, not Meta internal runs.
# The Intelligence Index cost chart uses estimates at proposed/list pricing;
# estimated costs are omitted rather than recorded as verified evaluation costs.

[[benchmarks]]
name = "AutomationBench-AA"
score = 37.8
metric = "strict pass@1"
dataset = "Zapier private set (657 tasks)"
effort = "max"
source = "https://research.meta.ai/blog/muse-ember"

# ALE v1.0 excludes five of 105 Linux tasks for all models due to storage limits
# or evaluation scripts not returning a score. Native scoring awards partial
# credit; the few LLM-judged checks use GPT-5.5.
[[benchmarks]]
name = "Agents' Last Exam"
score = 61.6
metric = "mean task score"
version = "1.0"
dataset = "Linux split (100 of 105 tasks)"
effort = "max"
harness = "Meta common internal agent loop"
variant = "5 tasks excluded for storage limits or unscored evaluation scripts; native partial-credit scoring"
source = "https://research.meta.ai/blog/muse-ember"

# Internal composite of Agents' Last Exam, AutomationBench-AA, JobBench,
# OfficeQA Pro V2, GDP.pdf, GDP.xlsx, VBT and FocusBench; not a single skill test.
[[benchmarks]]
name = "Personal Superintelligence Index"
score = 46.8
metric = "index score"
effort = "max"
variant = "Meta internal composite of eight personal and knowledge-work evaluations"
source = "https://research.meta.ai/blog/muse-ember"

# The scorecard selects each model's best published harness. Ember's result is
# Artificial Analysis's mini-swe-agent run, not a Muse Code run.
[[benchmarks]]
name = "Terminal-Bench"
score = 40.9
metric = "accuracy"
version = "4.0"
dataset = "Full (66 tasks)"
effort = "max"
harness = "mini-swe-agent"
variant = "Artificial Analysis run; launch scorecard uses each model's best published harness"
source = "https://research.meta.ai/blog/muse-ember"

# Per the report, CAI v2.0 combines Terminal-Bench 4.0, SWE-Atlas-QnA and
