# Sources:
# - https://unbiased.ai/model-card/
# - https://developers.cloudflare.com/ai/models/unbiased/pareto/
# - https://openrouter.ai/api/v1/models/unbiased/pareto/endpoints
# Sampling: the published request schema takes temperature and top_p but no top_k
#   (https://developers.cloudflare.com/ai/models/unbiased/pareto/, Parameters).
# Image input: the Unbiased model card says only "Pareto accepts text and image inputs" and no Unbiased doc lists
#   formats, so the input stays generic `image`.
schema = 2
name = "Pareto"
description = "Blended multimodal model that runs multiple language models in parallel and returns a synthesized answer"
open_weights = false
release_date = "2026-09-17"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 262_144
output = 131_072

[[benchmarks]]
name = "DeepSWE"
score = 70.0
metric = "score (%)"
version = "1.1"
dataset = "30-task slice; not the full 113-task v1.1 set"
variant = "Pareto 26.9; preliminary Unbiased run"
source = "https://unbiased.ai/model-card/"
date = "2026-09-20"

[[benchmarks]]
name = "DeepSWE"
score = 69.9
metric = "score (%)"
version = "1.1"
dataset = "task denominator not reported"
variant = "Pareto 26.10 preview; preliminary October 1 run"
source = "https://unbiased.ai/blog/pareto-26-10-preview/"
date = "2026-10-01"

[[benchmarks]]
name = "Terminal-Bench"
score = 50.8
metric = "task resolution rate"
version = "4.0.0"
variant = "Pareto 26.10 preview; preliminary October 1 run"
source = "https://unbiased.ai/blog/pareto-26-10-preview/"
date = "2026-10-01"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 49.9
metric = "accuracy"
version = "unspecified"
dataset = "HLE text-only; item count not reported"
variant = "Pareto 26.10 preview; preliminary October 1 run"
source = "https://unbiased.ai/blog/pareto-26-10-preview/"
date = "2026-10-01"
