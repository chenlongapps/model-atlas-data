# Sources (accessed 2026-10-19):
# - https://platform.minimax.io/docs/api-reference/api-overview
# - https://platform.minimaxi.com/docs/api-reference/api-overview
# - https://platform.minimax.io/docs/api-reference/text-anthropic-api
# - https://platform.minimax.io/docs/api-reference/text-openai-api
# - https://platform.minimax.io/docs/guides/models-intro
# Input formats: images JPEG/PNG/GIF/WEBP, videos MP4/AVI/MOV/MKV (MediaSource schema in
# https://platform.minimax.io/docs/api-reference/text-chat-anthropic).
# Sampling: temperature and top_p are request parameters; top_k is ignored
# (https://platform.minimax.io/docs/api-reference/text-anthropic-api: temperature [0, 2], top_p (0, 1]).
# Weights: not released yet ("Model weights will be released later",
# https://www.minimax.io/blog/minimax-m31f; no MiniMaxAI/MiniMax-M3.1-Flash repo on Hugging Face, 2026-10-19).
schema = 2
name = "MiniMax-M3.1-Flash"
description = "Frontier multimodal coding model with 1M context window and tunable thinking depth"
family = "minimax"
open_weights = true
release_date = "2026-10-19"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "video/x-msvideo", "video/quicktime", "video/x-matroska"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_000_000
output = 512_000

[[benchmarks]]
name = "DeepSWE"
score = 73.7
metric = "pass@1"
version = "1.1"
dataset = "v1.1 (113 tasks)"
variant = "512K context"
harness = "mini-SWE-agent 2.4.5"
source = "https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash"

[[benchmarks]]
name = "SWE-bench Pro"
score = 96.57
metric = "task resolution rate"
version = "2.0.0"
dataset = "Full public V2 split (642 tasks)"
effort = "xhigh"
variant = "Scale leaderboard alias: Minimax M3p1 Flash; reported ±1.16"
harness = "mini-swe-agent"
source = "https://labs.scale.com/leaderboard/swe_bench_pro_public_v2?tab=full"

[[benchmarks]]
name = "Terminal-Bench"
score = 38.1
metric = "task resolution rate"
version = "4.0.0"
dataset = "terminal-bench/terminal-bench@4.0.0 (66 tasks)"
harness = "Codex 0.149.1"
source = "https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash"

[[benchmarks]]
name = "Terminal-Bench-Science"
score = 3.3
metric = "task resolution rate"
version = "0.1.0"
dataset = "harborframework/terminal-bench-science; terminalbenchscience_0_1 (70 tasks)"
variant = "pass@1 averaged over three repeats"
harness = "mini-swe-agent"
source = "https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash/blob/main/.eval_results/terminal-bench-science.yaml"

[[benchmarks]]
name = "AutomationBench"
score = 62.8
metric = "task_completed_correctly"
version = "1.0.6"
dataset = "600 publicly released tasks"
source = "https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 43.4
metric = "accuracy"
version = "unspecified"
dataset = "Text-only subset (2,158 questions)"
variant = "without tools"
source = "https://huggingface.co/MiniMaxAI/MiniMax-M3.1-Flash"

