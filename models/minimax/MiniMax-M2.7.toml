# Sampling: top_p defaults to 0.9 on M2.x and top_k is ignored
# (https://platform.minimax.io/docs/api-reference/text-anthropic-api).
schema = 2
name = "MiniMax-M2.7"
description = "Open MiniMax flagship for coding agents, office automation, and complex environments"
family = "minimax"
open_weights = true
release_date = "2026-03-18"

[metadata.modelatlas.parameters]
total_billion = 230
active_billion = 10
sources = ["https://artificialanalysis.ai/models/minimax-m2-7"]
notes = "Explicit total and active counts published by Artificial Analysis for M2.7, not inferred from another M2 version or quantized tensor storage."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 204_800
output = 131_072

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/MiniMaxAI/MiniMax-M2.7"

[[benchmarks]]
name = "SWE-Bench Verified"
score = 79.9
metric = "resolved"
harness = "Claude Code"
source = "https://www.minimax.io/blog/minimax-m3"
date = "2026-06-01"

[[benchmarks]]
name = "SWE-Bench Pro"
score = 56.2
metric = "resolve rate"
harness = "Claude Code"
source = "https://www.minimax.io/blog/minimax-m3"
date = "2026-06-01"

[[benchmarks]]
name = "Terminal-Bench"
score = 51.1
metric = "success rate"
version = "2.1"
source = "https://www.minimax.io/blog/minimax-m3"
date = "2026-06-01"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 28.0
metric = "accuracy"
dataset = "HLE no-tool subset"
variant = "thinking enabled; no tools; single sample (pass@1); Artificial Analysis Index v4.0 protocol"
source = "https://arxiv.org/html/2605.26494"
