# Input formats: images JPEG/PNG/GIF/WEBP, videos MP4/AVI/MOV/MKV (MediaSource schema in
# https://platform.minimax.io/docs/api-reference/text-chat-anthropic).
# Sampling: temperature and top_p are request parameters; top_k is ignored
# (https://platform.minimax.io/docs/api-reference/text-anthropic-api).
schema = 2
name = "MiniMax-M3"
description = "MiniMax multimodal model for long-context coding, perception, and agent planning"
family = "minimax"
open_weights = true
release_date = "2026-06-01"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "video/mp4", "video/x-msvideo", "video/quicktime", "video/x-matroska"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_048_576
output = 512_000

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/MiniMaxAI/MiniMax-M3"

[[benchmarks]]
name = "SWE-Bench Verified"
score = 80.5
metric = "resolved"
harness = "Claude Code"
source = "https://www.minimax.io/blog/minimax-m3"
date = "2026-06-01"

[[benchmarks]]
name = "SWE-Bench Pro"
score = 59.0
metric = "resolve rate"
harness = "Claude Code"
source = "https://www.minimax.io/blog/minimax-m3"
date = "2026-06-01"

