# Sampling: top_p defaults to 0.9 on M2.x and top_k is ignored
# (https://platform.minimax.io/docs/api-reference/text-anthropic-api).
schema = 2
name = "MiniMax-M2.1"
description = "Earlier MiniMax agent model for practical coding and productivity tasks"
family = "minimax"
open_weights = true
release_date = "2025-12-23"

[metadata.modelatlas.parameters]
total_billion = 230
active_billion = 10
sources = ["https://artificialanalysis.ai/models/minimax-m2-1"]
notes = "Explicit total and active counts published by Artificial Analysis for M2.1, not inferred from another M2 version or quantized tensor storage."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 204_800
output = 131_072

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/MiniMaxAI/MiniMax-M2.1"

[[benchmarks]]
name = "SWE-Bench Verified"
score = 74
metric = "resolved"
source = "https://huggingface.co/MiniMaxAI/MiniMax-M2.1"

[[benchmarks]]
name = "SWE-Bench Pro"
score = 36.81
metric = "resolve rate"
dataset = "public"
source = "https://labs.scale.com/leaderboard/swe_bench_pro_public"
