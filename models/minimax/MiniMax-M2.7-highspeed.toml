# Sampling: top_p defaults to 0.9 on M2.x and top_k is ignored
# (https://platform.minimax.io/docs/api-reference/text-anthropic-api).
schema = 2
name = "MiniMax-M2.7-highspeed"
description = "Low-latency M2.7 variant for interactive coding plans and agent loops"
family = "minimax"
open_weights = true
release_date = "2026-03-18"

[metadata.modelatlas.parameters]
total_billion = 230
active_billion = 10
sources = ["https://artificialanalysis.ai/models/minimax-m2-7", "https://huggingface.co/MiniMaxAI/MiniMax-M2.7"]
notes = "Counts for the M2.7 checkpoint linked by this local speed-tier entry; no distinct architecture is assumed from the API speed tier."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 204_800
output = 131_072

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/MiniMaxAI/MiniMax-M2.7"
