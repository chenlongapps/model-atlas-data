# Benchmarks: official MiMo-V2.6 RL checkpoint evaluation table; metrics left as score where unspecified.
# Formats (Xiaomi MiMo API, lists this model as supported):
#   images JPEG, PNG, GIF, WebP, BMP: https://mimo.mi.com/docs/en-US/quick-start/usage-guide/multimodal-understanding/image-understanding
#   audio MP3, WAV, FLAC, M4A, OGG: https://mimo.mi.com/docs/en-US/quick-start/usage-guide/multimodal-understanding/audio-understanding
#   video MP4, MOV, AVI, WMV: https://mimo.mi.com/docs/en-US/quick-start/usage-guide/multimodal-understanding/video-understanding
# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host. The checkpoint's
#   generation_config.json sets temperature 1.0 and top_p 0.95; the MiMo API pins both in thinking mode
#   (https://mimo.mi.com/docs/en-US/api/chat/openai-api).
schema = 2
name = "MiMo-V2.6-Flash"
description = "MiMo Flash model for multimodal coding agents and long-context automation"
family = "mimo"
open_weights = true
release_date = "2026-09-22"

[metadata.modelatlas.parameters]
total_billion = 309
active_billion = 15
sources = ["https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL"]
notes = "Official architecture section's rounded total and active counts; no draft-model or encoder sum inferred."

[modalities]
input = [
  "text",
  "image/jpeg",
  "image/png",
  "image/gif",
  "image/webp",
  "image/bmp",
  "audio/mpeg",
  "audio/wav",
  "audio/flac",
  "audio/mp4",
  "audio/ogg",
  "video/mp4",
  "video/quicktime",
  "video/x-msvideo",
  "video/x-ms-wmv",
]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 131_072

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/XiaomiMiMo/MiMo-V2.6-Flash-RL"

