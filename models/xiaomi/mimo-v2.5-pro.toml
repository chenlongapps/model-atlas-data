# Benchmarks sourced from MiMo-V2.6-Flash-RL use its "MiMo-V2.5 Pro" comparison column.
# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host. The checkpoint's
#   generation_config.json sets temperature 1.0 and top_p 0.95; the MiMo API pins both in thinking mode
#   (https://mimo.mi.com/docs/en-US/api/chat/openai-api).
schema = 2
name = "MiMo-V2.5-Pro"
description = "Stronger MiMo Pro tier for multimodal reasoning and coding-agent execution"
family = "mimo"
open_weights = true
knowledge = "2024-12"
release_date = "2026-04-22"

[metadata.modelatlas.parameters]
total_billion = 1020
active_billion = 42
sources = ["https://huggingface.co/XiaomiMiMo/MiMo-V2.5-Pro"]
notes = "Official model-zoo and architecture table counts, with 1.02T converted to B. Uses the author's rounded architecture convention, not serialized auxiliary tensors."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 131_072

