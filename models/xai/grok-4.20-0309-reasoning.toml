schema = 2
name = "Grok 4.20 (Reasoning)"
description = "Reasoning Grok for document-heavy analysis and long-horizon tool use"
family = "grok"
open_weights = false
release_date = "2026-03-09"

[modalities]
input = ["text", "image/jpeg", "image/png", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 30_000

[[benchmarks]]
name = "Humanity's Last Exam"
score = 32
metric = "accuracy"
dataset = "Original HLE set (2,500 questions)"
source = "https://artificialanalysis.ai/models/comparisons/grok-4-20-0309-vs-grok-4"
