# Scores use the Grok 4.6 High column in the Grok 4.7 announcement unless another source is listed.
# The announcement date is not an evaluation date, so no benchmark date is inferred from it.
schema = 2
name = "Grok 4.6"
description = "xAI's frontier model for long-running agents, coding, knowledge work, and visual projects"
family = "grok"
open_weights = false
knowledge = "2026-02-01"
release_date = "2026-08-12"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 500_000
output = 500_000

