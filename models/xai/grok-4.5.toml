schema = 2
name = "Grok 4.5"
description = "xAI's Grok model for chat, coding, agentic tools, and lower hallucination risk"
family = "grok"
open_weights = false
# Official launch announcement: https://x.ai/news/grok-4-5 (2026-07-16).
release_date = "2026-07-08"

[modalities]
input = ["text", "image/jpeg", "image/png"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 500_000
output = 500_000

