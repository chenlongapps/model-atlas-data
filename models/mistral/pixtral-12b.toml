# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Release date: https://docs.mistral.ai/models/pixtral-12b-24-09 (2024-09-11)
schema = 2
name = "Pixtral 12B"
description = "Mistral vision-language model for image understanding and multimodal chat"
family = "pixtral"
open_weights = true
knowledge = "2024-09"
release_date = "2024-09-11"

[metadata.modelatlas.parameters]
notes = "Official decoder and vision encoder counts are separate observations, not an inferred complete total."

[[metadata.modelatlas.parameters.components]]
name = "Multimodal Decoder"
total_billion = 12
sources = ["https://huggingface.co/mistralai/Pixtral-12B-2409"]

[[metadata.modelatlas.parameters.components]]
name = "Vision Encoder"
total_billion = 0.4
sources = ["https://huggingface.co/mistralai/Pixtral-12B-2409"]

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 128_000

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/mistralai/Pixtral-12B-2409"
