# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Sampling: temperature and top_p only; Mistral's chat API has no top_k (https://docs.mistral.ai/api/endpoint/chat; 400 "top_k sampling is not enabled for this model", 2026-10-19)
schema = 2
name = "Mistral Medium 3"
description = "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"
family = "mistral-medium"
open_weights = false
knowledge = "2025-05"
release_date = "2025-05-07"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 131_072
output = 131_072

[[benchmarks]]
name = "Artificial Analysis Coding Index"
score = 13.6
metric = "index"
source = "https://openrouter.ai/mistralai/mistral-medium-3/benchmarks"
date = "2026-05-30"

[[benchmarks]]
name = "SciCode"
score = 33.1
metric = "percent correct"
source = "https://openrouter.ai/mistralai/mistral-medium-3/benchmarks"
date = "2026-05-30"

[[benchmarks]]
name = "Terminal-Bench Hard"
score = 3.8
metric = "success rate"
source = "https://openrouter.ai/mistralai/mistral-medium-3/benchmarks"
date = "2026-05-30"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 4.52
metric = "accuracy"
dataset = "Final original HLE; 2,500 public questions, multimodal"
variant = "Scale Labs evaluation; temperature=0.0 when configurable (otherwise provider-stated); o3-mini-2025-01-31 extractor/judge; tool use not stated"
harness = "Scale Labs leaderboard"
source = "https://labs.scale.com/leaderboard/humanitys_last_exam"
