# Lab metadata carried over from providers/openrouter/models/mistralai/mistral-medium-3-5.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Sampling: temperature and top_p only; Mistral's chat API has no top_k (https://docs.mistral.ai/api/endpoint/chat; 400 "top_k sampling is not enabled for this model", 2026-10-19)
schema = 2
name = "Mistral Medium 3.5"
description = "Mistral model for multilingual chat, reasoning, and tool-assisted workflows"
family = "mistral-medium"
open_weights = false
release_date = "2026-04-28"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 262_144
output = 209_715

[[benchmarks]]
name = "Terminal-Bench"
score = 0
metric = "task resolution rate"
version = "4.0"
dataset = "66 tasks"
variant = "pass@1 averaged over three repeats"
harness = "mini-swe-agent"
source = "https://artificialanalysis.ai/models/comparisons/step-5-vs-mistral-medium-3-5"

[[benchmarks]]
name = "Terminal-Bench-Science"
score = 0
metric = "task resolution rate"
version = "0.1.0"
dataset = "70 tasks"
variant = "pass@1 averaged over three repeats"
harness = "mini-swe-agent"
source = "https://artificialanalysis.ai/models/comparisons/mistral-medium-3-5-vs-mistral-small-4"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 14
metric = "accuracy"
dataset = "2,158 text-only questions from the May 2025 HLE revision (2,500 questions total)"
variant = "pass@1; GPT-5.6 Luna (medium) equality checker"
harness = "Artificial Analysis HLE evaluation"
source = "https://artificialanalysis.ai/models/comparisons/mistral-medium-3-5-vs-glm-5-1"

[[benchmarks]]
name = "Artificial Analysis Intelligence Index"
score = 5
metric = "index score"
version = "5.0.1"
source = "https://artificialanalysis.ai/models/mistral-medium-3-5"

[[benchmarks]]
name = "Artificial Analysis Intelligence Index"
score = 4.64508756526957
metric = "index score"
version = "5.0.1"
effort = "high"
source = "https://artificialanalysis.ai/models/mistral-medium-3-5"
