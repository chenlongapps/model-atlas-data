# Lab metadata carried over from providers/openrouter/models/mistralai/ministral-14b-2512.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
schema = 2
name = "Ministral 3 14B 2512"
description = "Compact Mistral model for edge, latency-sensitive, and cost-efficient workloads"
family = "ministral"
open_weights = true
release_date = "2025-12-02"

[metadata.modelatlas.parameters]
total_billion = 13.94503168
sources = ["https://huggingface.co/api/models/mistralai/Ministral-3-14B-Instruct-2512-BF16", "https://docs.mistral.ai/models/ministral-3-14b-25-12.md"]
notes = "Hub-published complete multimodal count from Mistral's official BF16 release, whose card links the no-loss FP8 edition. Documentation maps the API name to this December 2025 model."

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 209_715
