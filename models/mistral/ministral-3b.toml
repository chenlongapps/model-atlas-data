# Sources:
# https://mistral.ai/news/ministraux/
# https://ai.azure.com/catalog/models/Ministral-3B
schema = 2
name = "Ministral 3B"
description = "Compact Mistral model for edge, latency-sensitive, and cost-efficient workloads"
family = "ministral"
open_weights = true
knowledge = "2024-03"
release_date = "2024-10-16"

[metadata.modelatlas.parameters]
total_billion = 3
sources = ["https://openrouter.ai/mistralai/ministral-3b", "https://docs.mistral.ai/models/ministral-3b-24-1.md"]
notes = "OpenRouter explicitly describes the October 2024 Ministral 3B as a 3B-parameter model. Mistral's documentation identifies the retired ministral-3b-2410 version and distinguishes its December 2025 replacement. This is a rounded published specification, not a count inherited from Ministral 3 3B Instruct 2512. Public availability of the 2024 checkpoint is not established by this parameter source."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 8_192
