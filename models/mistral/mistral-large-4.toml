# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Sampling: temperature and top_p only; Mistral's chat API has no top_k (https://docs.mistral.ai/api/endpoint/chat; 400 "top_k sampling is not enabled for this model", 2026-10-19)
schema = 2
name = "Mistral Large 4"
description = "Mistral's 1T-parameter multimodal MoE for reasoning, coding, and agentic work"
family = "mistral-large"
open_weights = true
release_date = "2026-10-05"
license = "Mistral Ecosystem Open Weight License"

[metadata.modelatlas.parameters]
total_billion = 1000
active_billion = 52
sources = ["https://huggingface.co/mistralai/Mistral-Large-4-1T-A52B/blob/6c0166e17ab8a3d504ff1553804abec9fb0993dc/README.md"]
notes = "Official card: ~1T total and ~52B active including embeddings and output layers (49B per token excluding them). The FP8 checkpoint does not publish safetensors statistics."

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_048_576
output = 262_144

[[benchmarks]]
name = "DeepSWE"
score = 61.7
version = "1.1"
variant = "public preview"
source = "https://mistral.ai/news/mistral-large-4/"

[[benchmarks]]
name = "Terminal-Bench"
score = 28.3
metric = "task resolution rate"
version = "4.0.0"
variant = "public preview"
source = "https://mistral.ai/news/mistral-large-4/"

