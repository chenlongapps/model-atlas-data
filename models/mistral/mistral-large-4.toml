# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
# Sampling: temperature and top_p only; Mistral's chat API has no top_k (https://docs.mistral.ai/api/endpoint/chat; 400 "top_k sampling is not enabled for this model", 2026-10-19)
schema = 2
name = "Mistral Large 4"
description = "Mistral's 1T-parameter multimodal MoE for reasoning, coding, and agentic work"
family = "mistral-large"
open_weights = false
release_date = "2026-10-06"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 1_048_576
output = 262_144

[[benchmarks]]
name = "DeepSWE"
score = 61.7
version = "1.1"
variant = "public preview"
source = "https://mistral.ai/news/mistral-large-4/"

[[benchmarks]]
name = "Terminal-Bench"
score = 28.3
metric = "task resolution rate"
version = "4.0.0"
variant = "public preview"
source = "https://mistral.ai/news/mistral-large-4/"

[[benchmarks]]
name = "Terminal-Bench"
score = "27.78 ± 1.82"
metric = "task resolution rate"
version = "4.0.0"
dataset = "66 tasks"
variant = "avg@3 (3 runs; pass@1 each)"
harness = "Mini-SWE-agent"
source = "https://vals-ai.com/benchmarks/terminal-bench-4"

[[benchmarks]]
name = "Artificial Analysis Intelligence Index"
score = 25
metric = "index score"
version = "5.0"
variant = "public preview"
source = "https://artificialanalysis.ai/models/mistral-large-4-preview"
