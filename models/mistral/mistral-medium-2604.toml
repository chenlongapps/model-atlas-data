# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
schema = 2
name = "Mistral Medium 3.5"
description = "Balanced Mistral model for enterprise assistants, multilingual work, and tools"
family = "mistral-medium"
open_weights = true
release_date = "2026-04-29"

[metadata.modelatlas.parameters]
total_billion = 128
sources = ["https://huggingface.co/mistralai/Mistral-Medium-3.5-128B"]

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 262_144

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/mistralai/Mistral-Medium-3.5-128B"

[[benchmarks]]
name = "SWE-Bench Verified"
score = 77.6
metric = "resolved"
source = "https://huggingface.co/mistralai/Mistral-Medium-3.5-128B"

[[benchmarks]]
