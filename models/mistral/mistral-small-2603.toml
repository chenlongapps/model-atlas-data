# Image formats: https://docs.mistral.ai/studio/conversations/vision (PNG, JPEG, WEBP, non-animated GIF)
schema = 2
name = "Mistral Small 4"
description = "Fast Mistral production model for chat, extraction, and cost-sensitive agents"
family = "mistral-small"
open_weights = true
knowledge = "2025-06"
release_date = "2026-03-16"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 256_000
output = 256_000

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/mistralai/Mistral-Small-4-119B-2603"

[[benchmarks]]
name = "Artificial Analysis Coding Index"
score = 24.3
metric = "index"
source = "https://openrouter.ai/mistralai/mistral-small-2603/benchmarks"
date = "2026-06-01"

[[benchmarks]]
name = "SciCode"
score = 38
metric = "percent correct"
source = "https://openrouter.ai/mistralai/mistral-small-2603/benchmarks"
date = "2026-06-01"

[[benchmarks]]
name = "Terminal-Bench Hard"
score = 17.4
metric = "success rate"
source = "https://openrouter.ai/mistralai/mistral-small-2603/benchmarks"
date = "2026-06-01"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 10
metric = "accuracy"
dataset = "Original HLE 2,500-question set"
variant = "Reasoning"
source = "https://artificialanalysis.ai/models/comparisons/mistral-small-4-vs-gpt-5-codex"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 4
metric = "accuracy"
dataset = "Original HLE 2,500-question set"
variant = "Non-reasoning"
source = "https://artificialanalysis.ai/models/comparisons/mistral-small-4-non-reasoning-vs-qwen3-5-397b-a17b"

[[benchmarks]]
name = "Artificial Analysis Intelligence Index"
score = 4.29716249600478
metric = "index score"
version = "5.0.1"
variant = "Reasoning"
source = "https://artificialanalysis.ai/models/mistral-small-4"
