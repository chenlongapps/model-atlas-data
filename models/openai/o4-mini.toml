schema = 2
name = "o4-mini"
description = "Fast o-series model for compact reasoning, coding, and tool use"
family = "o-mini"
open_weights = false
knowledge = "2024-05"
release_date = "2025-04-16"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 200_000
output = 100_000

