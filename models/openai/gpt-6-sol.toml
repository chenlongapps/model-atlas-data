schema = 2
name = "GPT-6 Sol"
description = "OpenAI model for complex coding and agentic workflows"
family = "gpt-sol"
open_weights = false
knowledge = "2026-04-20"
release_date = "2026-09-22"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_050_000
input = 922_000
output = 128_000

