# Sources: https://developers.openai.com/api/docs/models/gpt-6.2-astra (limits, modalities, knowledge cutoff), https://openai.com/index/introducing-gpt-6-2-astra-sol/ (launch 2026-11-17).
# Sampling: live 2026-11-17: effort none is rejected (400) and any temperature other than 1 (or top_p other than 1) returns 400
# "Unsupported parameter: temperature", so temperature and top_p stay false.
schema = 2
name = "GPT-6.2 Astra"
description = "A frontier reasoning model for coding, computer use, and professional work such as slides, spreadsheets, and documents."
family = "gpt-astra"
open_weights = false
knowledge = "2026-05-18"
release_date = "2026-11-17"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_050_000
input = 922_000
output = 128_000

# Artificial Analysis model configuration data and v5.0.1 methodology.

