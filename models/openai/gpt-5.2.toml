schema = 2
name = "GPT-5.2"
description = "Reliable GPT generation for broad coding, writing, and tool-assisted product work"
family = "gpt"
open_weights = false
knowledge = "2025-08-31"
release_date = "2025-12-11"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 400_000
input = 272_000
output = 128_000

[[benchmarks]]
name = "SWE-Bench Pro"
score = 29.94
metric = "resolve rate"
dataset = "public"
source = "https://labs.scale.com/leaderboard/swe_bench_pro_public"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 27.80
metric = "accuracy"
dataset = "Final original HLE; 2,500 public questions, multimodal"
variant = "Scale Labs evaluation; temperature=0.0 when configurable (otherwise provider-stated); o3-mini-2025-01-31 extractor/judge; tool use not stated"
harness = "Scale Labs leaderboard"
source = "https://labs.scale.com/leaderboard/humanitys_last_exam"
