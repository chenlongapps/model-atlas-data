schema = 2
name = "GPT-4o (2024-11-20)"
description = "GPT model for general reasoning, writing, coding, and tool-assisted tasks"
family = "gpt"
open_weights = false
knowledge = "2023-09"
release_date = "2024-11-20"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = false

[limit]
context = 128_000
output = 16_384

[[benchmarks]]
name = "Aider Polyglot"
score = 18.2
metric = "percent correct"
source = "https://aider.chat/docs/leaderboards/"
date = "2024-12-30"

[[benchmarks]]
name = "Artificial Analysis Coding Index"
score = 16.7
metric = "index"
source = "https://openrouter.ai/openai/gpt-4o-2024-11-20/benchmarks"
date = "2026-03-11"

[[benchmarks]]
name = "SciCode"
score = 33.3
metric = "percent correct"
source = "https://openrouter.ai/openai/gpt-4o-2024-11-20/benchmarks"
date = "2026-03-11"

[[benchmarks]]
name = "Terminal-Bench Hard"
score = 8.3
metric = "success rate"
source = "https://openrouter.ai/openai/gpt-4o-2024-11-20/benchmarks"
