schema = 2
name = "GPT-6 Luna"
description = "OpenAI's most efficient model for focused, high-volume tasks"
family = "gpt-luna"
open_weights = false
knowledge = "2026-05-18"
release_date = "2026-09-22"

[modalities]
input = ["text", "image/jpeg", "image/png", "image/gif", "image/webp", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = false
top_p = false
top_k = false

[limit]
context = 1_050_000
input = 922_000
output = 128_000

[[benchmarks]]
name = "DeepSWE"
score = 66.6
metric = "score"
version = "1.1"
dataset = "113 tasks"
effort = "max"
source = "https://openai.com/index/introducing-gpt-6-sol-and-luna/"

