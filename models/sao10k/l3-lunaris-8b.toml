# Lab metadata carried over from providers/openrouter/models/sao10k/l3-lunaris-8b.toml (curated catalogue data
#   already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Sampling: open weights, so temperature, top_p and top_k are runtime sampler settings on any host; the model card
#   (https://huggingface.co/Sao10K/L3-8B-Lunaris-v1) recommends temperature 1.4, min_p 0.1.
schema = 2
name = "Llama 3 8B Lunaris"
description = "Open Llama instruction model for multilingual chat, reasoning, and coding"
family = "llama"
open_weights = true
knowledge = "2023-12-31"
release_date = "2024-08-13"

[metadata.modelatlas.parameters]
total_billion = 8.030261248
sources = ["https://huggingface.co/api/models/Sao10K/L3-8B-Lunaris-v1"]
notes = "Hub-published BF16 parameter count for this complete merged checkpoint, converted to B."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 8_192
output = 7_372
