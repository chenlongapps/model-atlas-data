# Release date (10/15/2026) and formats (model card input formats: video mp4, image jpeg and png):
#   https://huggingface.co/nvidia/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-BF16
# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host;
#   the model card recommends temperature 1.0 (0.6 for vision) and top_p 0.95.
schema = 2
name = "Nemotron 3.5 Super VL 120B A12B"
description = "NVIDIA vision-language reasoning model for text, image, and video understanding and agentic tool use"
family = "nemotron"
open_weights = true
release_date = "2026-10-15"

[modalities]
input = ["text", "image/jpeg", "image/png", "video/mp4"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 8_192

[[benchmarks]]
name = "Humanity's Last Exam"
score = 29.20
metric = "accuracy"
version = "unspecified"
dataset = "HLE full set, 2,500 questions, 1 sample per question"
variant = "BF16"
source = "https://build.nvidia.com/nvidia/nemotron-3.5-super-vl-120b-a12b/modelcard"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 29.00
metric = "accuracy"
version = "unspecified"
dataset = "HLE full set, 2,500 questions, 1 sample per question"
variant = "NVFP4"
source = "https://build.nvidia.com/nvidia/nemotron-3.5-super-vl-120b-a12b/modelcard"

[[benchmarks]]
name = "Terminal-Bench"
score = 0.0
metric = "task resolution rate"
version = "4.0.0"
dataset = "Terminal-Bench 4.0, 66 tasks"
variant = "Vals AI Baseten-hosted evaluation; reported ±0.00"
harness = "Mini-SWE-agent"
source = "https://www.vals.ai/benchmarks/terminal-bench-4"

[[benchmarks]]
name = "Terminal-Bench-Science"
score = 0
metric = "task resolution rate"
version = "0.1.0"
dataset = "70 tasks"
variant = "pass@1 averaged over 3 repeats; AA comparison displays rounded integer percent"
harness = "mini-swe-agent"
source = "https://artificialanalysis.ai/models/comparisons/nemotron-3-5-super-vl-vs-gpt-6-1-sol"

[[benchmarks]]
