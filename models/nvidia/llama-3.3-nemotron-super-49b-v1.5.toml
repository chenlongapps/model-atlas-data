# Sampling: open weights, so temperature/top_p/top_k are runtime features of the host;
#   the model card recommends temperature 0.6 and top_p 0.95 with reasoning on: https://huggingface.co/nvidia/Llama-3_3-Nemotron-Super-49B-v1_5
schema = 2
name = "Llama 3.3 Nemotron Super 49B v1.5"
description = "Nemotron model for efficient reasoning, coding, and specialized AI agents"
family = "nemotron"
open_weights = true
release_date = "2025-07-25"

[metadata.modelatlas.parameters]
total_billion = 49.867145216
sources = ["https://huggingface.co/api/models/nvidia/Llama-3_3-Nemotron-Super-49B-v1_5"]
notes = "Hub-published BF16 parameter count for the complete unquantized checkpoint, converted to B."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 131_072
output = 131_072
