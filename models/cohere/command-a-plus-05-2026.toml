# Image formats: https://docs.cohere.com/docs/image-inputs ("Limitations > File types": PNG, JPEG, WEBP,
#   non-animated GIF; listed as extensions, so the registered MIME types are used).
schema = 2
name = "Command A Plus"
description = "Cohere's stronger command model for multilingual agents and enterprise workflows"
family = "command-a"
open_weights = true
knowledge = "2025-04-01"
release_date = "2026-05-20"
last_updated = "2026-06-09"

[metadata.modelatlas.parameters]
total_billion = 218
active_billion = 25
sources = ["https://huggingface.co/CohereLabs/command-a-plus-05-2026-bf16"]

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 128_000
output = 64_000


[[benchmarks]]
name = "Terminal-Bench"
score = 1
metric = "task resolution rate"
version = "4.0.0"
dataset = "66 tasks"
variant = "pass@1 averaged over 3 repeats"
harness = "mini-swe-agent"
source = "https://artificialanalysis.ai/models/comparisons/gemini-3-8-flash-vs-command-a-plus"

[[benchmarks]]
name = "Terminal-Bench-Science"
score = 0
metric = "task resolution rate"
version = "0.1.0"
dataset = "70 tasks"
variant = "pass@1 averaged over 3 repeats"
harness = "mini-swe-agent"
source = "https://artificialanalysis.ai/models/comparisons/gemini-3-8-flash-vs-command-a-plus"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 12
metric = "accuracy"
dataset = "May 2025 revision; 2,158 text-only questions"
variant = "pass@1"
source = "https://artificialanalysis.ai/models/comparisons/command-a-plus-vs-claude-sonnet-4-6-adaptive"

[[benchmarks]]
name = "Artificial Analysis Intelligence Index"
score = 6.24120025576958
metric = "index score"
version = "5.0.1"
source = "https://artificialanalysis.ai/models/command-a-plus"
