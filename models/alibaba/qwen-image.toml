# Source: https://huggingface.co/Qwen/Qwen-Image (accessed 2026-11-02): 20B MMDiT
# text-to-image model, open-sourced under Apache-2.0; announced 2025-08-19.
# Diffusion image model: no temperature/top_p/top_k sampling and no token output
# budget, following the qwen-image family convention (models/alibaba/qwen-image-2.1.toml);
# output PNG; 8,192-token prompt budget.
schema = 2
v2_only = true
type = "image"
name = "Qwen-Image"
description = "Open-weight Qwen image model for prompt-driven generation and visual design workflows"
family = "qwen-image"
open_weights = true
release_date = "2025-08-19"
license = "Apache-2.0"

[metadata.modelatlas.parameters]
sources = ["https://huggingface.co/Qwen/Qwen-Image/blob/75e0b4be04f60ec59a75f475837eced720f823b6/README.md"]
notes = "The card calls the visual generation component 20B and does not state a complete pipeline total; the text encoder and VAE are recorded as separate components."

[[metadata.modelatlas.parameters.components]]
name = "Visual generation transformer (MMDiT)"
total_billion = 20.430401088
sources = ["https://huggingface.co/Qwen/Qwen-Image/blob/75e0b4be04f60ec59a75f475837eced720f823b6/transformer/diffusion_pytorch_model.safetensors.index.json"]
notes = "Verified from all nine BF16 shard headers."

[[metadata.modelatlas.parameters.components]]
name = "Text encoder (Qwen2.5-VL-7B)"
total_billion = 8.292166656
sources = ["https://huggingface.co/Qwen/Qwen-Image/blob/75e0b4be04f60ec59a75f475837eced720f823b6/text_encoder/model.safetensors.index.json"]
notes = "Index total for the four BF16 text-encoder shards."

[[metadata.modelatlas.parameters.components]]
name = "VAE"
total_billion = 0.126892531
sources = ["https://huggingface.co/Qwen/Qwen-Image/blob/75e0b4be04f60ec59a75f475837eced720f823b6/vae/diffusion_pytorch_model.safetensors"]
notes = "BF16 VAE tensor header count."

[modalities]
input = ["text"]
output = ["image/png"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 8_192
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Qwen/Qwen-Image"
