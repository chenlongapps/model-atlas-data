# Sources (accessed 2026-07-20):
# https://docs.qwencloud.com/token-plan/personal/token-plan-personal-overview
# https://platform.qianwenai.com/docs/token-plan/personal/token-plan-personal-overview
# https://docs.qwencloud.com/developer-guides/getting-started/text-generation-models
# https://platform.qianwenai.com/docs/developer-guides/getting-started/text-generation-models
# https://docs.qwencloud.com/developer-guides/clients-and-developer-tools/opencode
# https://platform.qianwenai.com/docs/developer-guides/clients-and-developer-tools/opencode
# https://docs.qwencloud.com/developer-guides/clients-and-developer-tools/kilo-cli
# https://platform.qianwenai.com/docs/developer-guides/clients-and-developer-tools/kilo-cli
# https://github.com/QwenLM/qwen-code/issues/7198
# https://github.com/QwenLM/qwen-code/pull/7199
# Input MIME types: images and video per https://www.alibabacloud.com/help/en/model-studio/vision (Image limits, Video limits; video lists extensions, registered MIME types used)
# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
# Removed 15 benchmark rows whose only source was the 2026-08-03 GA release for Qwen3.8-Max; the source did not identify a Preview checkpoint.
# Alibaba announced the Preview ID would route to GA starting 2026-08-06: https://www.alibabacloud.com/en/notice/alibaba_cloud_model_studio_model_upgrade_notice_81a?_p_lc=1
schema = 2
name = "Qwen3.8 Max Preview"
description = "Preview Qwen flagship for million-token multimodal reasoning and long-horizon agentic workflows"
family = "qwen"
open_weights = false
release_date = "2026-07-19"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 131_072
