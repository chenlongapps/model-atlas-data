# Sources (accessed 2026-09-18):
# https://www.alibabacloud.com/help/en/model-studio/qwen3-8-omni-flash
# https://www.alibabacloud.com/help/en/model-studio/qwen-omni
# Input MIME types: images and video per https://www.alibabacloud.com/help/en/model-studio/vision (Image limits, Video limits; video lists extensions, registered MIME types used)
# Audio input: AMR, WAV, 3GP/3GPP, AAC, MP3 per https://www.alibabacloud.com/help/en/model-studio/qwen-omni (registered MIME types used)
# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
name = "Qwen3.8 Omni Flash"
description = "Qwen omni model for text, vision, audio, and multimodal agent tasks"
family = "qwen"
open_weights = false
release_date = "2026-09-17"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "audio/amr", "audio/wav", "audio/3gpp", "audio/aac", "audio/mpeg", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 131_072

[[benchmarks]]
name = "DeepSWE"
score = 57.8
metric = "pass@1"
version = "1.1"
harness = "Claude Code / mini-SWE-agent; highest across both, winning harness undisclosed"
variant = "temperature=1.0; top_p=0.95; context=256K"
source = "https://arxiv.org/html/2609.25611"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 36.5
metric = "accuracy"
version = "unspecified"
dataset = "HLE; tested item count/subset not reported"
variant = "GPT-4o judged"
source = "https://arxiv.org/html/2609.25611"

[[benchmarks]]
name = "SWE-bench Pro"
score = 63.3
harness = "Claude Code"
variant = "temperature=1.0; top_p=0.95; context=256K; problematic tasks corrected and re-evaluated on refined benchmark; benchmark version/task count not stated"
source = "https://arxiv.org/html/2609.25611"
