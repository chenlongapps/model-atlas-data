# Sources (accessed 2026-09-03):
# https://www.qwencloud.com/models/qwen3.8-max-0902
# https://www.alibabacloud.com/help/en/model-studio/qwen3-8-max
# https://docs.qwencloud.com/developer-guides/text-generation/thinking
# Snapshot of qwen3.8-max (alias qwen3.8-max-2026-09-02). Same limits,
# hybrid thinking, modalities, and tool ecosystem as qwen3.8-max; post-trained
# for stronger coding, collaborative agents, and vision/document understanding.
# PDF input: inherits Completions PDF理解 / document parsing from the Max line
# (same as models/alibaba/qwen3.8-max.toml).
# Input MIME types: images and video per https://www.alibabacloud.com/help/en/model-studio/vision (Image limits, Video limits; video lists extensions, registered MIME types used)
# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
name = "Qwen3.8 Max 0902"
description = "2026-09-02 upgraded snapshot of Qwen3.8 Max with stronger coding, collaborative agents, and multimodal document understanding"
family = "qwen"
open_weights = false
release_date = "2026-09-02"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv", "application/pdf"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 131_072

[[benchmarks]]
name = "Terminal-Bench"
score = 39
metric = "share of tasks passed (pass@1)"
version = "4.0.0"
dataset = "Full (66 tasks)"
variant = "Mean of three pass@1 runs; 500 agent-step limit; upstream task timeouts and sandbox resources"
harness = "mini-swe-agent"
source = "https://artificialanalysis.ai/models/comparisons/qwen3-8-max-vs-qwen3-8-max-0803"

[[benchmarks]]
name = "Terminal-Bench"
score = 38.89
metric = "accuracy"
version = "4.0.0"
dataset = "Full (66 tasks)"
variant = "avg@3 (mean of three pass@1 runs); 8-hour task limit; no step or cost limit"
harness = "Mini-SWE-agent"
source = "https://www.vals.ai/benchmarks/terminal-bench-4"

