# Source: https://www.qwencloud.com/models/qwen3.8-flash
# Input MIME types: images and video per https://www.alibabacloud.com/help/en/model-studio/vision (Image limits, Video limits; video lists extensions, registered MIME types used)
# Sampling: temperature, top_p and top_k are request parameters on Model Studio: https://www.alibabacloud.com/help/en/model-studio/qwen-api-via-openai-chat-completions
schema = 2
name = "Qwen3.8 Flash"
description = "Qwen vision-language model for visual reasoning, documents, and agent tasks"
family = "qwen"
open_weights = false
release_date = "2026-08-26"

[modalities]
input = ["text", "image/bmp", "image/jpeg", "image/png", "image/tiff", "image/webp", "image/heic", "video/mp4", "video/x-msvideo", "video/x-matroska", "video/quicktime", "video/x-flv", "video/x-ms-wmv"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 131_072

[[benchmarks]]
name = "DeepSWE"
score = 58.7
metric = "score"
version = "1.1"
source = "https://docs.qwencloud.com/developer-guides/getting-started/latest-model"

[[benchmarks]]
name = "SWE-bench Pro"
score = 62.5
metric = "score"
source = "https://docs.qwencloud.com/developer-guides/getting-started/latest-model"

[[benchmarks]]
name = "Chartography"
score = 17.4
metric = "accuracy/mean"
dataset = "100 tasks"
effort = "xHigh reasoning"
variant = "10 runs per task; Gemini 3.5 Flash judge"
source = "https://surgehq.ai/benchmarks/chartography"
