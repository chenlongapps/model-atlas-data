# Sources (accessed 2026-10-21):
# - https://huggingface.co/perplexity-ai/pplx-decider-v1.2 (Apache-2.0; created 2026-10-15)
# - https://docs.perplexity.ai/docs/decisions/quickstart: state of text, JSON or images (PNG, JPEG and WebP data URLs, up to
#   8 images per question), 256K-token context window, typed answers with probabilities and no generated text.
# Sampling: the Decisions API takes no sampling parameters.
schema = 2
v2_only = true
type = "decision"
name = "pplx-decider-v1.2"
description = "Perplexity's open-weight decision model on Qwen3.8-27B that returns probabilities for typed yes/no, choice and score questions about text or images"
open_weights = true
release_date = "2026-10-15"
license = "Apache-2.0"

[metadata.modelatlas.parameters]
notes = "Main checkpoint and required readout are scoped separately; no complete total is inferred by adding components."

[[metadata.modelatlas.parameters.components]]
name = "Main checkpoint (without readout)"
total_billion = 26.08533016
sources = ["https://huggingface.co/perplexity-ai/pplx-decider-v1.2/blob/cce0f3f80033e9d89d80831d5281fd72124aacce/model.safetensors.index.json", "https://huggingface.co/api/models/perplexity-ai/pplx-decider-v1.2"]
notes = "Hub BF16 count independently verified against all eleven main shard headers."

[[metadata.modelatlas.parameters.components]]
name = "Readout"
total_billion = 0.0013056
sources = ["https://huggingface.co/perplexity-ai/pplx-decider-v1.2/blob/cce0f3f80033e9d89d80831d5281fd72124aacce/readout.safetensors"]
notes = "Stored BF16 weight count verified from this separate head's tensor header."

[modalities]
input = ["text", "image/png", "image/jpeg", "image/webp"]
output = ["decision"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 262_144
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/perplexity-ai/pplx-decider-v1.2"
