# Lab metadata carried over from providers/openrouter/models/undi95/remm-slerp-l2-13b.toml (curated catalogue data
#   already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Sampling: open weights, so temperature, top_p and top_k are runtime sampler settings on any host.
schema = 2
name = "ReMM SLERP 13B"
description = "Open-weight instruction model for adaptable chat and self-hosted production workloads"
open_weights = true
knowledge = "2023-06-30"
release_date = "2023-07-22"

[metadata.modelatlas.parameters]
total_billion = 13.01586432
sources = ["https://huggingface.co/undi95/ReMM-SLERP-L2-13B/blob/9cf491450795628e28b8fd73f411977f7908c623/pytorch_model.bin.index.json"]
notes = "13,015,864,320 F32 weight values independently counted from ZIP data.pkl tensor descriptors across all three indexed shards. All 363 tensor names match the index; no weight payloads were loaded. This is a direct checkpoint count, not the historical leaderboard's rounded 13B size class."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 6_144
output = 5_529
