# Sampling: open weights; generation_config.json sets temperature and top_p, and the model card samples with
#   top_k=20 (https://huggingface.co/poolside/Laguna-S-2.1).
schema = 2
name = "Laguna S 2.1"
description = "118B Mixture-of-Experts agentic coding model from Poolside"
family = "laguna"
open_weights = true
release_date = "2026-07-21"

[metadata.modelatlas.parameters]
total_billion = 118
active_billion = 8
sources = ["https://huggingface.co/poolside/Laguna-S-2.1"]
notes = "Per-token active count is approximate in the official specification."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 32_768

[[benchmarks]]
name = "DeepSWE"
score = 40.4
metric = "pass@1"
version = "1.1"
effort = "Max thinking"
variant = "pass@1 averaged over 3 attempts per task"
harness = "pool"
source = "https://poolside.ai/blog/introducing-laguna-s-2-1"
date = "2026-07-21"
