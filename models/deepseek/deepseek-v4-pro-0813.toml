# Public code-agent benchmarks use DeepSeek Harness minimal mode, max effort, temperature=1.0, top_p=0.95.
# https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro-0813
# Released 2026-08-13 (V4-Pro GA): https://api-docs.deepseek.com/updates/#date-2026-08-13
schema = 2
name = "DeepSeek V4 Pro 0813"
description = "DeepSeek V4 Pro snapshot with million-token context and support for thinking and non-thinking modes"
family = "deepseek-thinking"
open_weights = true
release_date = "2026-08-13"
last_updated = "2026-08-22"
license = "MIT"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_000_000
output = 384_000

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro-0813"

