# Announced in the Ornith 1.0 family but not yet published on Hugging Face as
# of 2026-06-28 — no weights URL or benchmark scores available yet. Modalities
# and context window are provisional, assumed consistent with the rest of the
# family pending the public release.
# https://deep-reinforce.com/ornith_1_0.html
# Sampling: open weights; the Ornith model cards use temperature=0.6, top_p=0.95, top_k=20
#   (https://huggingface.co/ornith-ai/Ornith-1.0-9B, https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B).
# Input: image input comes from the Qwen3.5 vision stack (config.json image_token_id). Neither the model card nor
#   DeepReinforce (no first-party API) lists image formats, so input stays generic `image`.
schema = 2
name = "Ornith 1.0 31B"
description = "Open coding-reasoning model for repository tasks and self-improving agents"
family = "ornith"
open_weights = true
release_date = "2026-06-25"
license = "MIT"

[metadata.modelatlas.parameters]
total_billion = 31
sources = ["https://github.com/ornith-ai/Ornith-1/blob/d196d60faa9ee1b1daa811e8b552b4ee203b1272/README.md", "https://ornith.ai/ornith_1_0.html"]
notes = "Author-reported rounded architecture size, not an independently counted checkpoint: the original June 25, 2026 Ornith-1.0 README explicitly lists the available model scales and architectures as 9B-Dense, 31B-Dense, 35B-MoE and 397B-MoE, also stated in the official launch post. This records the author's 31B dense-model specification, not a number parsed from the local model ID or inherited from Gemma/Qwen. No accessible 31B checkpoint or exact serialized total has been verified; the repository's serving table lists only 9B, 35B and 397B releases."

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144

[[links]]
label = "Announcement"
url = "https://deep-reinforce.com/ornith_1_0.html"
type = "announcement"
