# https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B
# Sampling: open weights; generation_config.json sets temperature 1.0, top_p 0.95, top_k 20.
# Input: image input comes from the Qwen3.5 vision stack (config.json image_token_id). Neither the model card nor
#   DeepReinforce (no first-party API) lists image formats, so input stays generic `image`.
schema = 2
name = "Ornith 1.5 35B A3B"
description = "Mixture-of-experts coding-reasoning model for agentic software tasks, tool use, and image understanding"
family = "ornith"
open_weights = true
release_date = "2026-08-18"
last_updated = "2026-08-23"
license = "MIT"

[modalities]
input = ["text", "image"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B"

[[benchmarks]]
name = "DeepSWE"
score = 22
variant = "mean of 5 runs; temperature=1.0; top_p=0.95; context=256K"
harness = "Claude Code"
source = "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B"

[[benchmarks]]
name = "SWE-bench Pro"
score = 59.6
variant = "mean of 5 runs; temperature=1.0; top_p=0.95; context=256K; network disabled; git history removed"
harness = "OpenHands"
source = "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 25.6
metric = "accuracy"
variant = "no tools; mean of 5 runs; Claude 4.6 Opus judge"
source = "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 33.4
metric = "accuracy"
variant = "with tools; mean of 5 runs; Claude 4.6 Opus judge"
source = "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B"

[[links]]
label = "Model card"
url = "https://huggingface.co/ornith-ai/Ornith-1.5-35B-A3B"
type = "model_card"
