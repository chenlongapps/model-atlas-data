# Fibo 1.5 released 2026-08-24 (open weights): https://huggingface.co/briaai/Fibo-1.5
# Reference image formats (JPEG, JPG, PNG, WEBP) and PNG/JPEG results: https://docs.bria.ai/image-generation/generation/image-generate
schema = 2
v2_only = true
type = "image"
name = "FIBO Generate 1.5"
description = "Text-to-image model driven by structured JSON prompts, trained on licensed data"
open_weights = true
release_date = "2026-08-24"

[metadata.modelatlas.parameters]
notes = "Only the DiT architecture count is used; the text encoder and VAE are separate components with no complete total inferred."

[[metadata.modelatlas.parameters.components]]
name = "DiT"
total_billion = 8
sources = ["https://huggingface.co/briaai/Fibo-1.5"]
notes = "Official few-step release retains the base FIBO DiT architecture; not a full-pipeline parameter count."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp"]
output = ["image/png", "image/jpeg"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0
