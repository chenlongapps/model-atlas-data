# Sampling: open weights; generation_config.json sets temperature 0.9, top_p 1, top_k -1 and the model card
#   recommends temperature=0.9, top_p=1.0 (https://huggingface.co/tencent/Hy4-preview).
schema = 2
name = "Hy4 preview"
description = "A next-generation productivity model with significantly enhanced Agent and complex task execution capabilities."
family = "Hy"
open_weights = true
release_date = "2026-08-28"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_024_000
output = 64_000

[[benchmarks]]
name = "Terminal-Bench"
score = 8.08
cost = 3.07266
cost_unit = "USD/test"
cost_source = "https://www.vals.ai/_astro/benchmark_view_terminal_bench_4.g-vQx4Dh.json"
metric = "accuracy"
version = "4.0.0"
dataset = "Full (66 tasks)"
variant = "avg@3 (mean of three pass@1 runs); 8-hour task limit; no step or cost limit"
harness = "Mini-SWE-agent"
source = "https://www.vals.ai/benchmarks/terminal-bench-4"

[[benchmarks]]
name = "Terminal-Bench-Science"
score = 1.43
metric = "accuracy"
version = "0.1.0"
dataset = "Full (70 tasks)"
variant = "single pass@1 run; infrastructure/provider errors retried; 8-hour task limit"
harness = "Terminus 2"
source = "https://www.vals.ai/benchmarks/terminal-bench-science"

[[benchmarks]]
name = "Chartography"
score = 1.6
metric = "accuracy (mean; Pass@1)"
version = "unspecified"
dataset = "100 expert tasks"
effort = "High reasoning"
variant = "10 runs per task; Gemini 3.5 Flash judge"
harness = "Inspect AI"
source = "https://surgehq.ai/benchmarks/chartography"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 43.4
metric = "accuracy"
dataset = "Text-only"
variant = "no tools"
source = "https://huggingface.co/tencent/Hy4-preview"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 55.4
metric = "accuracy"
dataset = "Text-only"
variant = "with tools"
source = "https://huggingface.co/tencent/Hy4-preview"

