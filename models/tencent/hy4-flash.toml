# https://intl.cloud.tencent.com/document/product/1300/78934 (Hy4 flash: 1M context, 960K max input, 64K max output;
#   deep reasoning, function calling, caching, image understanding; accessed 2026-11-16)
# Released 2026-11-16 (Tencent Hy announcement). Image formats follow tencent/hy4.
schema = 2
name = "Hy4 flash"
description = "Tencent's lower-cost Hy4 tier for everyday agent and productivity tasks, with image understanding and a 1M-token context window."
family = "hy-flash"
open_weights = true
release_date = "2026-11-16"

[metadata.modelatlas.parameters]
total_billion = 220
active_billion = 12
sources = ["https://huggingface.co/tencent/Hy4-flash/blob/eccd3123eec73f2040f4c9ed0de1883593470510/README.md"]
notes = "Official headline: 220B total including 64B Engram parameters and 12B active per token (11.3B text + 0.43B vision). The specification table separately lists 155.5B excluding Engram, ViT and DFly2, plus 63.5B Engram, 0.43B ViT and 0.85B DFly2."

[modalities]
input = ["text", "image/jpeg", "image/png", "image/webp", "image/gif"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
input = 983_040
output = 65_536

# Source: https://hy.tencent.ai/research/hy4-flash
# Transcribed from the user-supplied official comparison-table screenshot on 2026-11-16;
# direct page retrieval returned HTTP 567. The evaluation date is not specified.
# All results use the highest available reasoning setting; no named effort is given.
# Costs are the reported CNY per task, based on official API prices. The source
# converts USD to CNY at a fixed 1 USD = 7.2 CNY; no currency conversion is applied here.

# WorkIndex (internal): all models evaluated on workbuddy cli.
# PPT artifacts are rendered to PDF using LibreOffice.
