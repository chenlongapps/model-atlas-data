# Lab metadata carried over from providers/openrouter/models/tencent/hy-mt2-30b-a3b.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Release: weights open-sourced 2026-05-21 per the model card News section
#   (https://huggingface.co/tencent/Hy-MT2-30B-A3B); the earlier date was a relay listing date.
# Sampling: open weights; the model card's recommended inference settings set temperature, top_p and top_k
