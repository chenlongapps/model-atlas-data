# Open weights: MIT-licensed checkpoint published 2026-10-13 at https://huggingface.co/inclusionAI/Ling-3.1-flash.
# Sampling: open weights; the model card recommends temperature, top_p and top_k (temperature=1.0, top_p=0.95, top_k=20)
#   (https://huggingface.co/inclusionAI/Ling-3.1-flash).
schema = 2
name = "Ling 3.1 Flash"
description = "Efficient model for low-latency assistance, extraction, and routine automation"
family = "ling"
open_weights = true
release_date = "2026-09-29"

[metadata.modelatlas.parameters]
total_billion = 560
active_billion = 25
sources = ["https://huggingface.co/inclusionAI/Ling-3.1-flash"]

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 262_144
output = 32_768

[[benchmarks]]
name = "Terminal-Bench"
score = 46.03
metric = "task resolution rate"
version = "4.0.0"
dataset = "harborframework/terminal-bench"
harness = "LingCode"
source = "https://huggingface.co/inclusionAI/Ling-3.1-flash/discussions/6/files"

[[benchmarks]]
name = "Terminal-Bench"
score = 33
metric = "task resolution rate"
version = "4.0.0"
dataset = "Artificial Analysis Terminal-Bench 4.0 (66 tasks)"
harness = "mini-swe-agent (pass@1 averaged over three repeats)"
source = "https://artificialanalysis.ai/models/comparisons/reflection-beam-vs-ling-3-1-flash"
