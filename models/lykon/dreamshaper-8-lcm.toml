# Published 2023-12-06 under CreativeML Open RAIL-M: https://huggingface.co/Lykon/dreamshaper-8-lcm
# DreamShaper 8 (a Stable Diffusion 1.5 fine-tune for photorealism) distilled with a latent consistency model for few-step
# generation. Output stays generic `image`: the open weights produce pixels and the format is chosen by the host.
# Prompts are not chat tokens, so context and output are 0.
schema = 2
v2_only = true
type = "image"
name = "DreamShaper 8 LCM"
description = "Latent-consistency distilled DreamShaper 8 Stable Diffusion fine-tune for fast photorealistic images"
family = "stable-diffusion"
open_weights = true
release_date = "2023-12-06"
license = "CreativeML Open RAIL-M"

[metadata.modelatlas.parameters]
notes = "U-Net statistic only; text encoder, VAE and alternate serialization formats are not added into a model total."

[[metadata.modelatlas.parameters.components]]
name = "U-Net"
total_billion = 0.859520964
sources = ["https://huggingface.co/Lykon/dreamshaper-8-lcm/blob/4645d8bc6a8e6b106d21606d63e8460cdad4f1a6/unet/diffusion_pytorch_model.safetensors"]
notes = "Exact stored F32 weight count verified from the component's actual tensor header, not from checkpoint file size."

[modalities]
input = ["text"]
output = ["image"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = false
top_p = false
top_k = false

[limit]
context = 0
output = 0

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/Lykon/dreamshaper-8-lcm"
