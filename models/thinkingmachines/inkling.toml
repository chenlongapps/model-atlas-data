# Sources (accessed 2026-07-22):
# - https://thinkingmachines.ai/news/introducing-inkling/
# - https://thinkingmachines.ai/model-card/inkling/
# - https://huggingface.co/thinkingmachines/Inkling
# Input formats: https://tinker-docs.thinkingmachines.ai/cookbook/inkling/images/ ("Formats: PNG and JPEG") and
#   https://tinker-docs.thinkingmachines.ai/cookbook/inkling/audio/ (WAV); the model card lists 16kHz WAV audio.
# Sampling: open weights, so temperature, top_p and top_k are runtime sampler settings on any host.
schema = 2
name = "Inkling"
description = "Multimodal MoE reasoning model (975B total, 41B active) for text, image, and audio"
family = "ling"
open_weights = true
release_date = "2026-07-15"
license = "Apache-2.0"

[modalities]
input = ["text", "image/png", "image/jpeg", "audio/wav"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 1_048_576

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/thinkingmachines/Inkling"

[[benchmarks]]
name = "SWE-bench Pro"
score = 89.88
metric = "task resolution rate"
version = "2.0.0"
dataset = "SWE-bench Pro V2 Full public set (642 tasks)"
effort = "xhigh"
variant = "reported ±2.10; uncapped cost limit; 250-turn limit"
harness = "mini-swe-agent"
source = "https://labs.scale.com/leaderboard/swe_bench_pro_public_v2?tab=full"

[[benchmarks]]
name = "Terminal-Bench"
score = 1
metric = "task resolution rate"
version = "4.0.0"
dataset = "Terminal-Bench 4.0 (66 tasks)"
effort = "Xhigh"
variant = "AA independent evaluation; pass@1 averaged over three repeats per task; 500-step cap"
harness = "mini-swe-agent"
source = "https://artificialanalysis.ai/models/comparisons/inkling-vs-gpt-5-6-sol-xhigh"

[[benchmarks]]
name = "Terminal-Bench"
score = 0.51
metric = "task resolution rate"
version = "4.0.0"
dataset = "Terminal-Bench 4.0 (66 tasks)"
effort = "0.99"
variant = "Vals AI avg@3; pass@1 per run; reported ±0.51; 8-hour task timeout"
harness = "Mini-SWE-agent"
source = "https://vals-ai.com/models/thinkingmachines_inkling"

