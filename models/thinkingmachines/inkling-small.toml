# Sources (accessed 2026-08-01):
# - https://thinkingmachines.ai/news/inkling-small/
# - https://huggingface.co/thinkingmachines/Inkling-Small
# Input formats: https://tinker-docs.thinkingmachines.ai/cookbook/inkling/images/ ("Formats: PNG and JPEG") and
#   https://tinker-docs.thinkingmachines.ai/cookbook/inkling/audio/ (WAV); the model card lists 16kHz WAV audio.
# Sampling: open weights, so temperature, top_p and top_k are runtime sampler settings on any host.
schema = 2
name = "Inkling Small"
description = "Multimodal MoE reasoning model (276B total, 12B active) for text, image, and audio"
family = "ling"
open_weights = true
release_date = "2026-07-30"
license = "Apache-2.0"

[modalities]
input = ["text", "image/png", "image/jpeg", "audio/wav"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 1_048_576

[[weights]]
label = "Hugging Face"
url = "https://huggingface.co/thinkingmachines/Inkling-Small"

[[benchmarks]]
name = "Terminal-Bench"
score = 0.0
cost = 0.321679
cost_unit = "USD/test"
cost_source = "https://www.vals.ai/_astro/benchmark_view_terminal_bench_4.g-vQx4Dh.json"
metric = "accuracy"
version = "4.0.0"
dataset = "66 tasks"
variant = "avg@3; per-run pass@1"
harness = "Mini-SWE-agent"
source = "https://www.vals.ai/benchmarks/terminal-bench-4"

[[benchmarks]]
name = "Chartography"
score = 9.1
metric = "accuracy (mean; Pass@1)"
dataset = "100 tasks"
effort = "xHigh reasoning"
variant = "10 runs per task"
harness = "Inspect AI"
source = "https://surgehq.ai/benchmarks/chartography"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 31.6
metric = "accuracy"
dataset = "2,158 text-only questions"
effort = "0.99"
variant = "text-only; no tools"
source = "https://thinkingmachines.ai/news/inkling-small/"

[[benchmarks]]
name = "Humanity's Last Exam"
score = 47.8
metric = "accuracy"
effort = "0.99"
variant = "with tools"
source = "https://thinkingmachines.ai/news/inkling-small/"

[[benchmarks]]
name = "Artificial Analysis Intelligence Index"
score = 12.9101620926084
cost = 0.20316116043899832
cost_unit = "USD/weighted task"
metric = "index score"
version = "5.0.1"
source = "https://artificialanalysis.ai/models/inkling-small/"

[[benchmarks]]
name = "Vals Index"
score = 27.59
cost = 0.401307
cost_unit = "USD/test"
cost_source = "https://www.vals.ai/_astro/benchmark_view_vals_index.CxyItaos.json"
metric = "performance score"
version = "2.2"
source = "https://www.vals.ai/benchmarks/vals_index"
