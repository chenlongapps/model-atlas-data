# Sources:
# - https://docs.inceptionlabs.ai/get-started/models (Mercury 2.5: 260K context, 65,536 max output, text, tool calling, structured outputs)
# - https://www.businesswire.com/news/home/20260908593295/en/ (launch, 2026-09-08)
# Sampling: temperature 0.5-1 is the only sampling parameter on the chat completions API, no top_p or top_k
# (https://docs.inceptionlabs.ai/api-reference/chat/create-a-chat-completion).
schema = 2
name = "Mercury 2.5"
description = "Reasoning model for deliberate analysis, multi-step problem solving, and tool use"
family = "mercury"
open_weights = false
release_date = "2026-09-08"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = false
top_k = false

[limit]
context = 260_000
output = 65_536

# Vals overall JSON checked 2026-11-06; model = "inception/mercury-2.5"; stderr = 0.0 percentage points.
# Row settings: max_output_tokens = 65536; reasoning_effort = "high"; provider = "Inception".
[[benchmarks]]
name = "Terminal-Bench"
score = 0
metric = "task resolution rate"
version = "4.0"
dataset = "66 tasks"
effort = "high"
variant = "avg@3 (mean of three pass@1 runs); 8-hour task limit; no step or cost limit"
harness = "Mini-SWE-agent"
cost = 0.368017
cost_unit = "USD/test"
source = "https://www.vals.ai/_astro/benchmark_view_terminal_bench_4.g-vQx4Dh.json"
