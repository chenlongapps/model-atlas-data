# Lab metadata carried over from providers/openrouter/models/amazon/nova-pro-v1.toml (curated catalogue data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Formats: https://docs.aws.amazon.com/nova/latest/userguide/modalities.html (images PNG, JPG, JPEG, GIF, WebP;
#   video MP4, MOV, MKV, WebM, FLV, MPEG, MPG, WMV, 3GP; media documents PDF, DOCX), as MIME types
# Sampling: temperature, topP and topK are inferenceConfig fields:
#   https://docs.aws.amazon.com/nova/latest/userguide/complete-request-schema.html
schema = 2
name = "Nova Pro 1.0"
description = "Flagship model for demanding analysis, coding, and production agent workflows"
family = "nova-pro"
open_weights = false
knowledge = "2024-10-31"
release_date = "2024-12-05"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/webp"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 300_000
output = 5_120

[[benchmarks]]
name = "Humanity's Last Exam"
score = 4.40
metric = "accuracy"
dataset = "Final original HLE; 2,500 public questions, multimodal"
variant = "Scale Labs evaluation; temperature=0.0 when configurable (otherwise provider-stated); o3-mini-2025-01-31 extractor/judge; tool use not stated"
harness = "Scale Labs leaderboard"
source = "https://labs.scale.com/leaderboard/humanitys_last_exam"
