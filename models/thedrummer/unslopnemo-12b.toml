# Lab metadata carried over from providers/openrouter/models/thedrummer/unslopnemo-12b.toml (curated catalogue
#   data already in this repo),
# with provider-specific fields (cost, reasoning_options, status) stripped.
# Sampling: open weights, so temperature, top_p and top_k are runtime sampler settings on any host.
schema = 2
name = "UnslopNemo 12B"
description = "Open-weight instruction model for adaptable chat and self-hosted production workloads"
open_weights = true
knowledge = "2024-04-30"
release_date = "2024-11-08"

[metadata.modelatlas.parameters]
total_billion = 12.2477824
sources = ["https://huggingface.co/api/models/TheDrummer/UnslopNemo-12B-v4.1", "https://openrouter.ai/api/v1/models"]
notes = "OpenRouter explicitly maps thedrummer/unslopnemo-12b to version v4.1. Uses that complete BF16 checkpoint's published count, not the distinct v1 checkpoint."

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = false }
reasoning = { supported = false }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_024_000
output = 819_200
