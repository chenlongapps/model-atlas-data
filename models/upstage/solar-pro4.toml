# Sources (accessed 2026-08-16):
#   https://developers.upstage.ai/docs/apis/chat
#   https://developers.upstage.ai/docs/capabilities/generate/reasoning
# Field values mirror Upstage's own first-party host entry in this repo
# (providers/upstage/models/solar-pro4.toml); host-scoped keys (cost,
# reasoning_options) are intentionally left to the provider files.
# Sampling: the chat API reference (https://console.upstage.ai/api/chat) documents temperature and top_p; no top_k.
schema = 2
name = "Solar Pro 4"
description = "Upstage's flagship model, specialized for agentic use"
family = "solar-pro"
open_weights = false
knowledge = "2026-02"
release_date = "2026-08-06"

[modalities]
input = ["text"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = false

[limit]
context = 524_288
output = 131_072

[[benchmarks]]
name = "Humanity's Last Exam"
score = 29
metric = "accuracy"
source = "https://artificialanalysis.ai/models/comparisons/gpt-6-astra-high-vs-solarpro4"

[[benchmarks]]
name = "Artificial Analysis Intelligence Index"
score = 14.1589437644357
cost = 0.9557366659448332
cost_unit = "USD/weighted task"
metric = "index score"
version = "5.0.1"
source = "https://artificialanalysis.ai/models/solar-pro4"
