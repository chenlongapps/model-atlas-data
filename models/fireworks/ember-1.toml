# Sources (accessed 2026-10-16):
# - https://fireworks.ai/blog/ember-1 — Fireworks Research's own model, built on Kimi K3, shorter reasoning traces (~40% fewer tokens).
# - https://fireworks.ai/models/fireworks/ember-1 — released 2026-09-22, ~1M context, image input, function calling, no open weights.
# - https://app.fireworks.ai/models/fireworks/ember-1 — usage example max_tokens 131072.
# - Image formats: https://docs.fireworks.ai/guides/querying-vision-language-models lists .png, .jpg, .jpeg, .gif, .bmp, .tiff
#   and .ppm, written here as their registered MIME types.
# - Sampling: Fireworks' chat completions API takes temperature, top_p and top_k
#   (https://docs.fireworks.ai/api-reference/post-chatcompletions).
schema = 2
name = "Ember-1"
description = "Specialized model from Fireworks built on Kimi K3, producing shorter reasoning traces with approximately 40% fewer tokens while maintaining comparable quality"
open_weights = false
release_date = "2026-09-22"

[modalities]
input = ["text", "image/png", "image/jpeg", "image/gif", "image/bmp", "image/tiff", "image/x-portable-pixmap"]
output = ["text"]

[capabilities]
tools = { supported = true }
reasoning = { supported = true }
temperature = true
top_p = true
top_k = true

[limit]
context = 1_048_576
output = 131_072

[[benchmarks]]
name = "DeepSWE"
score = 75.2
metric = "score"
version = "1.1"
dataset = "113 tasks"
source = "https://fireworks.ai/blog/ember-1"

[[benchmarks]]
name = "DeepSWE"
score = 67.0
metric = "score"
version = "1.1"
dataset = "113 tasks"
variant = "avg@3 (three-run mean)"
source = "https://fireworks.ai/specialized-intelligence-index/benchmarks/code-generation/deepswe-v1-1"

[[benchmarks]]
name = "Terminal-Bench"
score = "20.71 ± 3.64"
cost = 19.484094
cost_unit = "USD/test"
cost_source = "https://www.vals.ai/_astro/benchmark_view_terminal_bench_4.g-vQx4Dh.json"
metric = "accuracy"
version = "4.0"
dataset = "66 tasks"
variant = "avg@3 (three full runs; each run pass@1)"
harness = "Mini-SWE-agent"
source = "https://www.vals.ai/benchmarks/terminal-bench-4"

[[benchmarks]]
name = "Terminal-Bench-Science"
score = "5.71 ± 2.79"
metric = "accuracy"
version = "0.1.0"
dataset = "70 tasks"
variant = "single-run pass@1"
harness = "Mini-SWE-agent"
source = "https://www.vals.ai/benchmarks/terminal-bench-science"
