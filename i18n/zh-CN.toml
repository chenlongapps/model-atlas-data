"zhipuai/glm-image" = "GLM-Image 是采用自回归与扩散混合解码器架构的图像生成模型。总体图像生成质量与主流潜在扩散方法相当，但在文字渲染和知识密集型生成场景中优势显著。它尤其擅长需要精准语义理解和复杂信息表达的任务，同时具备强大的高保真、精细细节生成能力。除文生图外，GLM-Image 还支持丰富的图生图任务，包括图像编辑、风格迁移、保持身份特征的生成和多主体一致性生成。"

[benchmark.description]
"artificial-analysis-intelligence-index-v5" = "综合评估语言模型在知识工作、编程、科学及通用知识方面的表现，并汇总九项评测形成单一分数。"
"automationbench-v1.0.6" = "评估智能体在模拟商业应用中完成跨应用工作流的能力，以所有断言均通过的任务比例作为主指标。官方排行榜使用独立保留的私有任务集；公开任务集成绩不可直接视为同一评测结果。"
"chartography" = "以专业领域图表和专家编写的问题评估视觉读取、领域解释与多步图表推理。官方资料介绍了 100 项任务，但未标注语义化版本号；工具使用条件和多次采样指标需分别记录。"
"deepswe-v1.1" = "基于 113 项长周期软件工程任务评估编程智能体；v1.1 在隔离环境中验证智能体提交的补丁。"
"gdpval-aa-v2.1" = "Artificial Analysis 基于 OpenAI 公开 GDPval 数据集开展的独立评测，使用覆盖 44 种职业的 220 项任务。模型在智能体环境中产出专业工作成果；从裁判组中抽取 LLM 进行盲评成对比较，并汇总为 Elo 评分。"
"humanitys-last-exam" = "涵盖 100 多个学科的多模态学术问答评测。此定义指官方于 2025-04-03 定稿的 2,500 题原始集合；官方未给该集合标注语义化版本号，不包括 HLE-Rolling 或 HLE-Diamond。"
"osworld-v2.1" = "评估智能体完成真实桌面与应用中的长周期计算机操作工作流。此定义采用二元任务完成率；部分奖励是另一评分口径，不能与完成率混为一谈。"
"swe-bench-pro-v2" = "通过隐藏测试评估智能体解决真实代码库中的长周期软件工程任务的能力。V2 默认配置包含 642 项任务；HARD 子集和原 731 项 V1 配置是不同数据集，不应与默认配置混合。"
"terminal-bench-science-v0.1" = "以 70 项专家整理的终端科研工作流评估智能体，覆盖生命、物理、地球、数学和工程科学；通过任务专属测试验证科学数据分析、模拟、优化、证明和模型拟合等产出。"
"terminal-bench-v4" = "评估智能体在沙箱终端中完成软件、科学计算、安全和系统管理等任务的能力；此版本调整了任务集、环境与资源配置。"
"vals-index-v2.2" = "按各领域占美国 GDP 的比重加权汇总智能体在金融、编程、法律和税务任务中的表现，其中以信息产业作为编程领域的代理权重。"
