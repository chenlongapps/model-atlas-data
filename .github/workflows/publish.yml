name: Publish benchmark snapshot

on:
  workflow_dispatch:
    inputs:
      version:
        description: New content version (must exceed the live manifest version)
        required: true
        type: string
      allow_removals:
        description: Allow score IDs to be removed from the full snapshot
        required: false
        default: false
        type: boolean
      reason:
        description: Required explanation when removals are allowed
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: benchmark-pages-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ALLOW_REMOVALS: ${{ inputs.allow_removals }}
      REMOVAL_REASON: ${{ inputs.reason }}
      BASE_URL: https://chenlongapps.github.io/model-atlas-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - name: Download and verify published history
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/baseline/benchmarks build/baseline/attributions build/baseline/third_party
          fetch() {
            local url="$1"
            local path="$2"
            local status
            status=$(curl --silent --show-error --output "$path" --write-out '%{http_code}' "$url")
            if [[ "$status" != "200" ]]; then
              echo "Expected direct HTTP 200 for $url; got $status" >&2
              exit 1
            fi
          }
          fetch "$BASE_URL/manifest.json" build/baseline/manifest.json
          latest=$(python -c 'import json; print(json.load(open("build/baseline/manifest.json"))["version"])')
          if (( latest < 2 )); then
            echo 'The live baseline must contain the already-published v2 snapshot.' >&2
            exit 1
          fi
          for version in $(seq 2 "$latest"); do
            fetch "$BASE_URL/benchmarks/scores-v${version}.json" "build/baseline/benchmarks/scores-v${version}.json"
            fetch "$BASE_URL/attributions/v${version}.json" "build/baseline/attributions/v${version}.json"
          done
          python - <<'PY' > build/license-files.txt
          import json
          from pathlib import Path, PurePosixPath
          files = set()
          for path in Path('build/baseline/attributions').glob('v*.json'):
              document = json.loads(path.read_text(encoding='utf-8'))
              for source in document['sources']:
                  relative = source.get('license', {}).get('licenseFile')
                  if relative is None:
                      continue
                  parts = PurePosixPath(relative).parts
                  if not parts or parts[0] != 'third_party' or '..' in parts or any('\\' in part for part in parts):
                      raise SystemExit(f'Unsafe license path in published attribution: {relative!r}')
                  files.add('/'.join(parts))
          for relative in sorted(files):
              print(relative)
          PY
          while IFS= read -r relative; do
            mkdir -p "build/baseline/$(dirname "$relative")"
            fetch "$BASE_URL/$relative" "build/baseline/$relative"
          done < build/license-files.txt
      - name: Build reviewed full snapshot
        shell: bash
        run: |
          set -euo pipefail
          args=(--version "$RELEASE_VERSION" --baseline build/baseline --output "build/site-v$RELEASE_VERSION")
          if [[ "$ALLOW_REMOVALS" == "true" ]]; then
            args+=(--allow-removals --reason "$REMOVAL_REASON")
          fi
          python scripts/build.py "${args[@]}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site-v${{ inputs.version }}
      - name: Deploy complete Pages site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed manifest and snapshot bytes
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          from urllib.error import HTTPError
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          base = 'https://chenlongapps.github.io/model-atlas-data'
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, request, response, code, message, headers, new_url):
                  return None

          opener = build_opener(NoRedirect)
          def get(url, limit):
              try:
                  with opener.open(Request(url, headers={'Cache-Control': 'no-cache'}), timeout=30) as response:
                      if response.status != 200 or response.geturl() != url:
                          raise SystemExit(f'Expected direct HTTP 200 for {url}')
                      content = response.read(limit + 1)
              except HTTPError as error:
                  raise SystemExit(f'Expected direct HTTP 200 for {url}; got {error.code}') from error
              if len(content) > limit:
                  raise SystemExit(f'Response too large: {url}')
              return content

          manifest_bytes = get(base + '/manifest.json', 64 * 1024)
          manifest = json.loads(manifest_bytes)
          expected_version = int(__import__('os').environ['EXPECTED_VERSION'])
          if manifest.get('schemaVersion') != 1 or manifest.get('version') != expected_version:
              raise SystemExit('Deployed manifest has the wrong schema or version')
          parsed = urlsplit(manifest.get('url', ''))
          if parsed.scheme != 'https' or parsed.netloc != 'chenlongapps.github.io' or parsed.query or parsed.fragment:
              raise SystemExit('Deployed manifest contains an invalid snapshot URL')
          snapshot_bytes = get(manifest['url'], 16 * 1024 * 1024)
          if hashlib.sha256(snapshot_bytes).hexdigest().lower() != manifest.get('sha256', '').lower():
              raise SystemExit('Deployed snapshot SHA-256 does not match the manifest')
          snapshot = json.loads(snapshot_bytes)
          if snapshot.get('schemaVersion') != 1 or snapshot.get('version') != expected_version or not snapshot.get('scores'):
              raise SystemExit('Deployed snapshot is empty or has the wrong schema/version')
          print(f'OK: deployed v{expected_version}, {len(snapshot["scores"])} scores, SHA-256 verified')
          PY
