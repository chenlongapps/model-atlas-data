name: Publish reviewed benchmark data

# Deliberately manual: editing JSON alone must not approve or deploy data.
on:
  workflow_dispatch:

concurrency:
  group: benchmark-pages-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      - name: Restore archive or build a reviewed candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          version=$(python -c 'import json; print(json.load(open("data/release.json"))["version"])')
          tag="benchmark-data-v${version}"
          gh release list --limit 1000 --json tagName > build/releases.json
          latest=$(python -c 'import json,re; tags=[t["tagName"] for t in json.load(open("build/releases.json")) if re.fullmatch(r"benchmark-data-v[0-9]+",t["tagName"])]; print(max(tags,key=lambda t:int(t.rsplit("v",1)[1])) if tags else "")')
          if [[ "$latest" == "$tag" ]]; then
            gh release download "$tag" --pattern site.zip --dir build
            python scripts/release_archive.py --unpack build/site.zip --output build/site
            test "$(cat build/site/source-commit.txt)" = "$GITHUB_SHA"
          else
            if [[ -n "$latest" ]]; then
              gh release download "$latest" --pattern site.zip --dir build
              python scripts/release_archive.py --unpack build/site.zip --output build/baseline
              python scripts/prepare_release.py --baseline build/baseline
            else
              status=$(curl --silent --show-error --output build/online-manifest.json --write-out '%{http_code}' https://chenlongapps.github.io/model-atlas-data/manifest.json)
              if [[ "$status" != 404 ]]; then
                echo 'First release requires a 404 bootstrap endpoint; restore any existing release history before proceeding.' >&2
                exit 1
              fi
              python scripts/prepare_release.py
            fi
            mkdir -p build/archive
            python scripts/release_archive.py --pack build/site --output build/archive/site.zip --commit "$GITHUB_SHA"
            # Archive before deployment so even a failed Pages deployment is recoverable.
            gh release create "$tag" build/archive/site.zip --target "$GITHUB_SHA" --title "Benchmark data v${version}" --notes 'Immutable data candidate and complete history. Check this workflow deployment status; an archive alone does not mean Pages is live.'
          fi
          python scripts/validate.py --artifacts build/site
          python scripts/export_android.py --artifacts build/site
          mkdir -p build/pages
          cp build/site/manifest.json build/pages/
          cp build/site/.nojekyll build/pages/
          cp -R build/site/benchmarks build/site/attributions build/site/third_party build/pages/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/pages
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy complete site atomically
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Verify real HTTPS bytes after deployment
        run: python scripts/check_remote.py --expected-version "$(python -c 'import json; print(json.load(open("data/release.json"))["version"])')"
