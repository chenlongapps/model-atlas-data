name: Sync new Models.dev models

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-models
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARGOS_DEVICE_TYPE: cpu
    steps:
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: '.github/workflows/sync-models.yml'

      - name: Install sync dependency
        run: python3 -m pip install tomlkit==0.13.3

      - name: Test sync and validation scripts
        run: python3 -m unittest discover -s tests -v

      - name: Fetch upstream lab files
        run: |
          git clone --depth=1 --branch=dev --filter=blob:none --sparse https://github.com/anomalyco/models.dev.git "$RUNNER_TEMP/models-dev"
          git -C "$RUNNER_TEMP/models-dev" sparse-checkout set models

      - name: Preview new model candidates
        id: candidates
        run: |
          python3 scripts/sync_models.py sync --upstream "$RUNNER_TEMP/models-dev" --report "$RUNNER_TEMP/models-dev-preview.json" --dry-run
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'models-dev-preview.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f"added={len(report['added'])}", file=output)
          PYCODE

      - name: Configure translation cache directories
        if: steps.candidates.outputs.added != '0'
        run: |
          echo "ARGOS_PACKAGES_DIR=$RUNNER_TEMP/translation/packages" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/translation/data" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/translation/cache" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/translation/config" >> "$GITHUB_ENV"

      - name: Prepare optional Google dependency
        if: steps.candidates.outputs.added != '0'
        continue-on-error: true
        timeout-minutes: 5
        run: python3 -m pip install deep-translator==1.11.4

      - name: Prepare optional Argos CPU dependencies
        if: steps.candidates.outputs.added != '0'
        continue-on-error: true
        timeout-minutes: 5
        run: |
          python3 -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python3 -m pip install argostranslate==1.11.0

      - name: Restore Argos language and sentence resources
        if: steps.candidates.outputs.added != '0'
        continue-on-error: true
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ runner.temp }}/translation
          key: argos-${{ runner.os }}-py312-en-zh-1.9-${{ hashFiles('.github/workflows/sync-models.yml') }}

      - name: Prepare optional Argos language resources
        if: steps.candidates.outputs.added != '0'
        continue-on-error: true
        timeout-minutes: 5
        run: python3 scripts/translate_descriptions.py --prepare-argos

      - name: Import new models and update existing model information
        run: |
          python3 scripts/sync_models.py sync --upstream "$RUNNER_TEMP/models-dev" --report "$RUNNER_TEMP/models-dev-sync.json" --summary "$GITHUB_STEP_SUMMARY" --translate-descriptions

      - name: Verify synced models and translations
        run: |
          git add -- models/ i18n/zh-CN.toml
          python3 scripts/sync_models.py check-staged --report "$RUNNER_TEMP/models-dev-sync.json"

      - name: Refresh generated Benchmark results
        run: |
          python3 scripts/build.py
          python3 scripts/validate.py --check-results
          git add -A -- benchmark-results/

      - name: Commit and push verified data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          UPSTREAM_SHA=$(git -C "$RUNNER_TEMP/models-dev" rev-parse HEAD)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync Models.dev models' -m "Source: https://github.com/anomalyco/models.dev/tree/$UPSTREAM_SHA/models"
          git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
