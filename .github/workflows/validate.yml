name: Validate benchmark data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/validate.py
      - run: python -m unittest discover -s tests -v
      # CI previews only; production publication requires the separate manual workflow.
      - run: python scripts/build.py --version "$(python -c 'import json; print(json.load(open("data/release.json"))["version"])')"
      - run: python scripts/validate.py --artifacts build/preview
