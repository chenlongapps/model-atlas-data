name: Deploy data to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'benchmarks/**'
      - 'i18n/**'
      - 'scripts/build.py'
      - 'scripts/manifest.py'
      - 'scripts/validate.py'
      - 'tests/**'
      - 'LICENSE.models-dev'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  # GITHUB_TOKEN pushes from the sync workflow do not trigger push workflows.
  workflow_run:
    workflows: ['Sync new Models.dev models']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
          && (github.event_name != 'workflow_run'
              || (github.event.workflow_run.conclusion == 'success'
                  && github.event.workflow_run.head_branch == github.event.repository.default_branch
                  && github.event.workflow_run.head_repository.id == github.repository_id)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Build the latest default branch, including when a sync completion was queued.
      - name: Check out default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Run tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate TOML syntax
        run: python3 scripts/validate.py

      - name: Build JSON and include upstream license
        run: |
          python3 scripts/build.py --output "$RUNNER_TEMP/pages"
          cp LICENSE.models-dev "$RUNNER_TEMP/pages/LICENSE.models-dev"

      - name: Generate release manifest
        run: python3 scripts/manifest.py --output "$RUNNER_TEMP/pages"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
